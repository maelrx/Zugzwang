name: Bug report
description: Report reproducible incorrect behavior or evidence corruption.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets or private provider outputs. Use a private security advisory for vulnerabilities."
  - type: input
    id: version
    attributes: {label: Version/commit}
    validations: {required: true}
  - type: textarea
    id: protocol
    attributes: {label: Manifest/protocol coordinates, description: "Include R/H/K, provider, model, schema versions and bundle ID when safe."}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: Observed behavior}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Minimal reproduction and commands}
    validations: {required: true}
  - type: dropdown
    id: integrity
    attributes:
      label: Could this affect scientific evidence?
      options: ["Yes", "No", "Unknown"]
    validations: {required: true}
