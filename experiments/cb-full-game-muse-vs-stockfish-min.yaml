# PROVA REAL (diretiva do operador Mael): partida COMPLETA, brancas com
# CognitiveBoard (chess.cognitive_navigation) + muse-spark-1.3-contributor,
# pretas = Stockfish 16 no perfil mais fraco possível (elo 1000 +
# allow_approximate = Skill Level 0; SF16 não tem UCI_Elo nativo abaixo de
# 1320, este é o piso documentado do repo, ver local-musespark-1.3-free-vs-
# stockfish-1000.yaml). max_plies 120 é apenas guarda: full-game termina
# naturalmente em mate/empate. max_calls 300 = 60 decisões brancas x 4
# chamadas com folga.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: cb-full-game-muse-vs-stockfish-min
  tags: [cb, real, full-game, cognitive-navigation, stockfish-opponent, weakest]

spec:
  seed: 20260907

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: 120
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 180
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: low
        default_max_output_tokens: 4096

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1000
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 6, notation: uci}
    retries:
      transport: 0
      parse: 0
      illegal: 0

  budget:
    max_calls: 300
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
