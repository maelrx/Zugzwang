# ZGW-0101 pilot game B: NEW navigation (chess.cognitive_navigation, no
# cross-turn memory) vs random-legal, 6 plies. Same route/model/adversary
# and observation as game A; only the strategy differs (per-manifest).
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: cb-pilot-game-b-cognitive
  tags: [cb, pilot, real, game-b-cognitive]

spec:
  seed: 20260906

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: 6
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 180
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: low
        default_max_output_tokens: 2048

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.random-legal

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 6, notation: uci}
    retries:
      transport: 0
      parse: 0
      illegal: 0

  budget:
    max_calls: 24
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
