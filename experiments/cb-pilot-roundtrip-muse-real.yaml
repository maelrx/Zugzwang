# ZGW-0101 pilot: ONE real decision with Muse over the productive path.
# Native tool calling, single move-selection decision, paid model on the
# existing subscription via the local opencode-router loopback.
# Budget: 1 decision x up to 4 model calls. Fresh SQLite/CAS per workspace.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: cb-pilot-roundtrip-muse-real
  tags: [cb, pilot, real, openai-responses, native-tools]

spec:
  seed: 20260906

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: move-selection
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 180
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: low
        default_max_output_tokens: 2048

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: fake.stay

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: none}
    retries:
      transport: 0
      parse: 0
      illegal: 0

  budget:
    max_calls: 8
    max_concurrent_episodes: 1
    max_attempts: 1

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
