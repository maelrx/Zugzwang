# Move selection: one fixed position, one model move (R0).
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: chess-move-selection
  tags: [m2, chess, move-selection]

spec:
  seed: 20260816

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      kind: move-selection
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1

  players:
    white:
      model:
        backend: fake.backend
        provider: fake
        model: scripted
        strategy: chess.direct
    black:
      policy:
        plugin: fake.stay

  protocol:
    declared_assistance: H2
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: none, plies: 0, notation: uci}
    retries:
      transport: 0
      parse: 0
      illegal: 0

  budget:
    max_calls: 50
    max_concurrent_episodes: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
