# ZGW-0122 — gemini-3.8-flash-low low | brancas | H3 persistent tree (vitória histórica muse 46.Rb8#)
# Estratégia R7: single_agent_tree, hipótese h3-persistent-forced-replies, memória persistente,
# respostas forçadas do adversário em 2 plies. Sem cap: até mate ou empate.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: gemini-3.8-flash-low-low-white-h3-tree
  tags: [deepseek, gemini-3.8-flash-low, low, fullgame, real, stockfish1320, exploratory, h3-tree]

spec:
  seed: 20260931

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null  # ZGW-0120: sem cap — até mate ou empate
      search:
        hypothesis_id: h3-persistent-forced-replies
        memory_mode: persistent
        reply_scope: all
        prompt_mode: forced_replies
        max_root_branches: 4
        max_affordance_roots: 256
        max_variant_branches: 6
        max_nodes: 256
        max_depth_plies: 2
        max_validation_queries: 512
        max_transition_queries: 256
      backend_config:
        timeout_seconds: 420
        model: gemini-3.8-flash-low
        reasoning_effort: low
  players:
    white:
      model:
        backend: provider.antigravity_cli
        provider: antigravity-cli
        model: gemini-3.8-flash-low
        strategy: chess.single_agent_tree
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K6
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: full, plies: 0, notation: uci}
      legal_actions: {exposure: delayed, encoding: uci}
    legality:
      parse_feedback: true
      validation: {enabled: true, feedback: enumerated}
      enumerate: {enabled: false}
      transition_sandbox: true
      limits: {validations: 512, transitions: 256, depth_plies: 2, branch_states: 256}
    retry_profile: enumerate_after_failure
    retries: {transport: 4, parse: 0, illegal: 3, feedback: enumerated}

  budget:
    max_calls: 1200
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
