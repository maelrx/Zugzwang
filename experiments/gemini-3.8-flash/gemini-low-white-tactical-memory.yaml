# ZGW-0120 — gemini-3.8-flash low | full game | modelo de brancas vs SF-1320
# ZGW-0120: `gemini-3.8-flash-low` (provider opencode-go) com effort `low`.
# O adapter openai-compatible loweriza as chamadas sintéticas do harness
# (`harness:*`) para texto, satisfazendo o thinking-mode do Console Go.
# Rota: opencode-router (127.0.0.1:8788, Responses API) — faixa local.
# Observação: o gateway expõe `gemini-3.8-flash`; `gemini-3.8-flash-low` não existe
# no router e é registrado como pendência de nomenclatura no WO ZGW-0120.
# Config campeã: r6, inline_child, preload_root, factual, hist 12 uci, noascii.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: gemini-3.8-flash-low-fullgame-white
  tags: [deepseek, gemini-3.8-flash-low, low, fullgame, real, stockfish1320, exploratory]

spec:
  seed: 20260920

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null  # ZGW-0120: sem cap — até mate ou empate
      backend_config:
        timeout_seconds: 420
        model: gemini-3.8-flash-low
        reasoning_effort: low
      cognitive:
        max_rounds: 6
        preload_root: true
        inline_child_packages: true
        reasoning_memory: factual
        directive: >-
          TACTICAL PRIORITIES & FACTUAL MEMORY: On every turn, examine all
          forcing lines (checks, captures, immediate threats). Expand candidates
          to verify tactical safety. Retain factual tactical memory across
          rounds to avoid blunders. Finalize on ROOT via board_finalize once
          your candidate survives verification.

  players:
    white:
      model:
        backend: provider.antigravity_cli
        provider: antigravity-cli
        model: gemini-3.8-flash-low
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 12, notation: uci}
    retries:
      transport: 4
      parse: 2
      illegal: 5

  budget:
    max_calls: 320
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
