# Replicação H3 do jogo vencedor, GLM 5.3 Flash via ZCode Router local.
api_version: zgw.dev/v1alpha1
kind: Experiment
metadata:
  name: local-glm-5-3-flash-zcode-single-agent-tree-h3-replication
  tags: [local, zcode-router, glm-5.3-flash, r7, h3, replication, stockfish-1000]

spec:
  seed: 20260909
  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: 120
      search:
        hypothesis_id: h3-persistent-forced-replies
        memory_mode: persistent
        reply_scope: all
        prompt_mode: forced_replies
        max_root_branches: 4
        max_affordance_roots: 256
        max_variant_branches: 6
        max_nodes: 256
        max_depth_plies: 2
        max_validation_queries: 512
        max_transition_queries: 256
      backend_config:
        base_url: http://127.0.0.1:8787/v1
        provider_id: zcode-router
        api_key: env:ZCODE_ROUTER_API_KEY
        timeout_seconds: 300
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: medium
        default_max_output_tokens: 32768

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: zcode-router
        model: glm-5.3-flash
        strategy: chess.single_agent_tree
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1000
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K6
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: full, plies: 0, notation: uci}
      legal_actions: {exposure: delayed, encoding: uci}
    legality:
      parse_feedback: true
      validation: {enabled: true, feedback: enumerated}
      enumerate: {enabled: false}
      transition_sandbox: true
      limits: {validations: 512, transitions: 256, depth_plies: 2, branch_states: 256}
    retry_profile: enumerate_after_failure
    retries: {transport: 2, parse: 0, illegal: 3, feedback: enumerated}

  budget:
    max_calls: 600
    max_input_tokens: null
    max_output_tokens: null
    max_total_tokens: null
    max_usd: null
    max_wall_time_seconds: null
    max_failed_calls: null
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []
  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
