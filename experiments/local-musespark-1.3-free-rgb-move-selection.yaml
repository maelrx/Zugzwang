# Real multimodal smoke: MuseSpark receives symbolic state plus a rendered board.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: local-musespark-1-3-free-rgb-move-selection
  tags: [local, free-provider, multimodal, move-selection]

spec:
  seed: 20260932

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      kind: move-selection
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 120
        profile: openai-responses
        allow_private_network: true
        image_input: true
        reasoning_effort: minimal
        default_max_output_tokens: 2048

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor-free
        strategy: chess.direct
    black:
      policy:
        plugin: fake.stay

  protocol:
    declared_assistance: H2
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: none}
      image: {enabled: true, orientation: white, coordinates: true}
    retries:
      transport: 0
      parse: 0
      illegal: 0

  budget:
    max_calls: 2
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
