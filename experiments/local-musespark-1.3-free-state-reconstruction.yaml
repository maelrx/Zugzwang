# Real state-reconstruction smoke: MuseSpark predicts FENs from UCI history.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: local-musespark-1-3-free-state-reconstruction
  tags: [local, free-provider, state-reconstruction]

spec:
  seed: 20260931

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      kind: state-reconstruction
      move_sequences:
        - [e2e4]
        - [e2e4, e7e5, g1f3]
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 120
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: minimal
        default_max_output_tokens: 4096

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor-free
        strategy: chess.reconstruct
    black:
      policy:
        plugin: fake.stay

  protocol:
    declared_assistance: H2
    declared_knowledge: K0
    observation:
      position: {fen: false, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: full, plies: 0, notation: uci}
    retries:
      transport: 0
      parse: 0
      illegal: 0

  budget:
    max_calls: 4
    max_concurrent_episodes: 2
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
