# ZGW-0083: B-continuation retry (v2) from its SECOND death position.
# B-continue (run_0SyuvBEUH12Ff-7K_wttrg) survived the 600s timeout fix, played
# two sane moves (14.Re1 ...Ba6 15.Nd4 ...Ba6 -> actually 14.Re1 Bb5 15.Nd4 Ba6)
# then died at move 16 (white) by a NEW xhigh killer: output truncation.
# Step 4 emitted EXACTLY 32768 output tokens (= default_max_output_tokens),
# the reasoning was cut before the action, and the parser got "(sem lance)"
# x4 -> illegal_action_retry_exhausted. Fix: default_max_output_tokens 65536.
# Same H2 setup, timeout 600, no ply cap, fresh seed. Originals preserved.
api_version: zgw.dev/v1alpha1
kind: Experiment
metadata:
  name: local-musespark-1-3-go-h2-continuation-b2-xhigh
  tags: [local, opencode-go, zgw-0083, h2-continuation, single-agent-tree, persistent-all, no-ply-cap, effort-xhigh, hardened, maxout-64k]

spec:
  seed: 20260913

  matrix:
    mode: zip
    parameters:
      search:
        - {hypothesis_id: h2-continue-b2, memory_mode: persistent, reply_scope: all, prompt_mode: standard, max_root_branches: 4, max_affordance_roots: 256, max_variant_branches: 6, max_nodes: 256, max_depth_plies: 2, max_validation_queries: 512, max_transition_queries: 256}
      backend_config:
        - {base_url: http://127.0.0.1:8788/v1, provider_id: opencode-router, timeout_seconds: 600, profile: openai-responses, allow_private_network: true, reasoning_effort: xhigh, default_max_output_tokens: 65536}
      start_fen:
        - r3kb1r/p1p2ppq/b3pn2/7p/3N4/3P2N1/PPP2PPP/R1BQR1K1 w kq - 4 16

  task:
    config_from_matrix: [search, backend_config, start_fen]
    plugin: chess.tasks
    version: "0.1"
    config:
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      search: {}
      backend_config: {}

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.single_agent_tree
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1000
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K6
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: full, plies: 0, notation: uci}
      legal_actions: {exposure: delayed, encoding: uci}
    retries: {transport: 4, parse: 0, illegal: 3, feedback: enumerated}

  budget:
    max_calls: 600
    max_input_tokens: null
    max_output_tokens: null
    max_total_tokens: null
    max_usd: null
    max_wall_time_seconds: null
    max_failed_calls: null
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
