# ZGW-0083 follow-up: H2 setup (persistent-all, standard — the condition that hit
# the 120-ply cap) with NO ply cap (play to mate/natural end), 3 concurrent
# replicas, all at muse-spark-1.3-contributor xhigh reasoning effort.
# Opponent replicates the R7 profile (SF elo 1000 requested -> UCI_Elo 1320
# effective, Skill 0, 20k nodes). Fresh seed (never 20260909).
api_version: zgw.dev/v1alpha1
kind: Experiment
metadata:
  name: local-musespark-1-3-go-h2-nocap-xhigh-triple
  tags: [local, opencode-go, zgw-0083, h2-nocap, single-agent-tree, persistent-all, no-ply-cap, effort-xhigh, triple-replica]

spec:
  seed: 20260911

  matrix:
    mode: zip
    parameters:
      search:
        - {hypothesis_id: h2-nocap-xhigh-a, memory_mode: persistent, reply_scope: all, prompt_mode: standard, max_root_branches: 4, max_affordance_roots: 256, max_variant_branches: 6, max_nodes: 256, max_depth_plies: 2, max_validation_queries: 512, max_transition_queries: 256}
        - {hypothesis_id: h2-nocap-xhigh-b, memory_mode: persistent, reply_scope: all, prompt_mode: standard, max_root_branches: 4, max_affordance_roots: 256, max_variant_branches: 6, max_nodes: 256, max_depth_plies: 2, max_validation_queries: 512, max_transition_queries: 256}
        - {hypothesis_id: h2-nocap-xhigh-c, memory_mode: persistent, reply_scope: all, prompt_mode: standard, max_root_branches: 4, max_affordance_roots: 256, max_variant_branches: 6, max_nodes: 256, max_depth_plies: 2, max_validation_queries: 512, max_transition_queries: 256}
      backend_config:
        - {base_url: http://127.0.0.1:8788/v1, provider_id: opencode-router, timeout_seconds: 180, profile: openai-responses, allow_private_network: true, reasoning_effort: xhigh, default_max_output_tokens: 32768}
        - {base_url: http://127.0.0.1:8788/v1, provider_id: opencode-router, timeout_seconds: 180, profile: openai-responses, allow_private_network: true, reasoning_effort: xhigh, default_max_output_tokens: 32768}
        - {base_url: http://127.0.0.1:8788/v1, provider_id: opencode-router, timeout_seconds: 180, profile: openai-responses, allow_private_network: true, reasoning_effort: xhigh, default_max_output_tokens: 32768}

  task:
    config_from_matrix: [search, backend_config]
    plugin: chess.tasks
    version: "0.1"
    config:
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      search: {}
      backend_config: {}

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.single_agent_tree
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1000
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K6
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: full, plies: 0, notation: uci}
      legal_actions: {exposure: delayed, encoding: uci}
    retries: {transport: 6, parse: 0, illegal: 3, feedback: enumerated}

  budget:
    max_calls: 600
    max_input_tokens: null
    max_output_tokens: null
    max_total_tokens: null
    max_usd: null
    max_wall_time_seconds: null
    max_failed_calls: null
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
