# Real R7 full game: persistent episode memory and low reasoning effort.
api_version: zgw.dev/v1alpha1
kind: Experiment
metadata:
  name: local-musespark-1-3-go-legal-tree-memory-persistent-full-low
  tags: [local, opencode-go, r7, full-game, no-ply-cap, reasoning-low, memory-persistent]

spec:
  seed: 20260907

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      search:
        max_nodes: 24
        max_depth_plies: 2
        max_validation_queries: 64
        max_transition_queries: 32
        max_root_branches: 4
        memory_mode: persistent
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 120
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: low
        default_max_output_tokens: 16384

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.legal_tree_memory
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1000
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K6
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: full, plies: 0, notation: uci}
      legal_actions: {exposure: delayed, encoding: uci}
    legality:
      parse_feedback: true
      validation: {enabled: true, feedback: enumerated}
      enumerate: {enabled: false}
      transition_sandbox: true
      limits: {validations: 64, transitions: 32, depth_plies: 2, branch_states: 24}
    retry_profile: enumerate_after_failure
    retries: {transport: 2, parse: 0, illegal: 3, feedback: enumerated}

  budget:
    max_calls: null
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
