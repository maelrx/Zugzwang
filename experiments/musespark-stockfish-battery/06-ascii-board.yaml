api_version: zgw.dev/v1alpha1
kind: Experiment
metadata:
  name: local-musespark-1-3-free-stockfish-battery-06-ascii-board
  tags:
  - local
  - free-provider
  - stockfish-battery
  - single-game
  - 06-ascii-board
spec:
  seed: 20261006
  task:
    plugin: chess.tasks
    version: '0.1'
    config:
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 120
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: minimal
        default_max_output_tokens: 4096
  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor-free
        strategy: chess.direct
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1000
          allow_approximate: true
          limit:
            nodes: 20000
          options:
            Threads: '1'
            Hash: '16'
  protocol:
    declared_assistance: H2
    declared_knowledge: K0
    observation:
      position:
        fen: false
        ascii: true
      side_to_move: true
      move_number: true
      history:
        mode: last_n
        plies: 6
        notation: uci
    retries:
      transport: 5
      parse: 0
      illegal: 3
      feedback: legality_only
  budget:
    max_calls: null
    max_concurrent_episodes: 1
    max_attempts: 1
  evaluation: []
  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
