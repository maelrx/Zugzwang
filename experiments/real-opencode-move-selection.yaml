# REAL provider smoke (opt-in): opencode adapter + OpenCode Go deepseek-v4-flash.
# Requires: `opencode serve --port 4100` running locally, OPENCODE_GO_API_KEY in .env.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: real-opencode-move-selection
  tags: [e2e, real-provider, move-selection]

spec:
  seed: 20260816

  task:
    plugin: chess.tasks
    config:
      kind: move-selection
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      backend_config:
        base_url: http://127.0.0.1:4100
        provider_id: opencode-go
        timeout_seconds: 300

  players:
    white:
      model:
        backend: provider.opencode
        provider: opencode-go
        model: deepseek-v4-flash
        strategy: chess.direct
    black:
      policy:
        plugin: fake.stay

  protocol:
    declared_assistance: H2
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: none}
    retries:
      transport: 1
      parse: 0
      illegal: 0

  budget:
    max_calls: 5
    max_concurrent_episodes: 1

  evaluation:
    - plugin: evaluator.stockfish

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
