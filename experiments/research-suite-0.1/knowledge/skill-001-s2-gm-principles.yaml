  content:
    principles:
    - Control the center with pawns and pieces; central control is the foundation
      of any plan.
    - Develop minor pieces toward their most active squares before launching attacks.
    - 'King safety first: castle early and keep the pawn shield intact unless a clear
      reason exists to advance it.'
    - Improve your worst-placed piece; seek open files and outposts for rooks and
      knights.
    - Prefer moves with multiple purposes; avoid weakening pawn moves without compensation.
    - Trade pieces when you have a material or positional advantage; keep tension
      when attacking.
    - In endings, activate the king and create passed pawns; rook activity outweighs
      small pawn weaknesses.
    candidate_plans: []
    failure_modes:
    - Move-making without a plan; weakening pawn moves in front of your king.
