  applicability: {}
  content:
    principles:
    - 'Assess pawn structure: identify weak squares, backward pawns and open lines
      before choosing a plan.'
    - Attack where you have more pieces than the defender; mass forces on a wing before
      opening it.
    - If the opponent is better developed, keep the position closed; if you lead in
      development, open lines.
    - A knight on an unassailable center square is worth a rook in many closed positions.
    - Identify the opponent's best counterplay and address it before pursuing your
      own plan.
    candidate_plans: []
    failure_modes:
    - Attacking before development is complete.
