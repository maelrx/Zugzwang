  content:
    principles:
    - 'GM principle: the player who achieves the d5 break in an Open Sicilian usually
      equalizes fully; prepare it with ...e6 and ...Nbd7, not in one jump.'
    - 'GM principle: a wing attack fails while the center is fluid; stabilize the
      center before committing pawns on the flank.'
    - 'GM principle: when your opponent has a queenside majority, the minority attack
      with ...b5-b4 creates weaknesses even without material gain.'
    - 'GM principle: the knight on d5 that cannot be exchanged is worth more than
      a rook in the middlegame.'
    candidate_plans:
    - Coordinate ...d5 after clearing the e-file pin; avoid the break while White's
      f3-knight can recapture comfortably.
    failure_modes:
    - Releasing central tension without a concrete follow-up.
