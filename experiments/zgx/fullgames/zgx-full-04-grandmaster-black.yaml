api_version: zgw.dev/v1alpha1
kind: Experiment
metadata:
  name: zgx-full-04-grandmaster-black
  tags:
  - zgx
  - fullgame
  - real
  - stockfish1320
  - gemini-3.8-flash-low
  - untildone
spec:
  seed: 202699500
  task:
    plugin: chess.tasks
    version: '0.1'
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: black
      max_plies: null
      backend_config:
        provider_id: antigravity-cli
        model: gemini-3.8-flash-low
        timeout_seconds: 120
        reasoning_effort: low
        default_max_output_tokens: 8192
      cognitive:
        max_rounds: 4
        preload_root: true
        directive: 'GRANDMASTER SOLIDITY (BLACK): Defend solidly as Black against
          Stockfish 1320, neutralize White initiative, and strike when opponent overextends.
          (1) Check tactical threats and captures first. (2) Keep king secure. (3)
          Expand adversary replies before deciding. Crucial: finalize your move by
          Round 2 using board_finalize(node_id=''ROOT'', action_id=''<uci_action>'')
          on ROOT.'
        reasoning_memory: factual
  players:
    white:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit:
            nodes: 20000
          options:
            Threads: '1'
            Hash: '16'
    black:
      model:
        backend: provider.antigravity_cli
        provider: antigravity-cli
        model: gemini-3.8-flash-low
        strategy: chess.cognitive_navigation
  protocol:
    declared_assistance: H4
    declared_knowledge: K6
    observation:
      position:
        fen: true
        ascii: true
      history:
        mode: last_n
        plies: 6
        notation: uci
    legality:
      parse_feedback: true
      validation:
        enabled: true
        feedback: enumerated
      enumerate:
        enabled: false
      transition_sandbox: true
      limits:
        validations: 64
        transitions: 32
        depth_plies: 2
        branch_states: 24
    retry_profile: enumerate_after_failure
    retries:
      transport: 3
      parse: 2
      illegal: 5
      feedback: enumerated
  budget:
    max_calls: 3000
    max_concurrent_episodes: 1
