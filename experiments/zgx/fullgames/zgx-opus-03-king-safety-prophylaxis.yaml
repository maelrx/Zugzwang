api_version: zgw.dev/v1alpha1
kind: Experiment
metadata:
  name: zgx-opus-03-king-safety-prophylaxis
  tags:
  - zgx
  - opus
  - fullgame
  - real
  - stockfish1320
  - claude-opus-4-6
  - untildone
spec:
  seed: 202699800
  task:
    plugin: chess.tasks
    version: '0.1'
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      backend_config:
        provider_id: antigravity-cli
        model: claude-opus-4-6-thinking
        timeout_seconds: 180
        default_max_output_tokens: 8192
      cognitive:
        max_rounds: 4
        preload_root: true
        directive: 'KING SAFETY SENTINEL & DEEP HISTORY: Prioritize absolute king
          safety and prophylaxis above all else. Evaluate adversary counter-threats
          before launching attacks. Use the 12-ply game history to maintain structural
          integrity of the pawn shield. Crucial: finalize your move by Round 2 using
          board_finalize(node_id=''ROOT'', action_id=''<uci_action>'') on ROOT.'
  players:
    white:
      model:
        backend: provider.antigravity_cli
        provider: antigravity-cli
        model: claude-opus-4-6-thinking
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit:
            nodes: 20000
          options:
            Threads: '1'
            Hash: '16'
  protocol:
    declared_assistance: H4
    declared_knowledge: K6
    observation:
      position:
        fen: true
        ascii: false
      history:
        mode: last_n
        plies: 12
        notation: uci
    legality:
      parse_feedback: true
      validation:
        enabled: true
        feedback: enumerated
      enumerate:
        enabled: false
      transition_sandbox: true
      limits:
        validations: 64
        transitions: 32
        depth_plies: 2
        branch_states: 24
    retry_profile: enumerate_after_failure
    retries:
      transport: 3
      parse: 2
      illegal: 5
      feedback: enumerated
  budget:
    max_calls: 3000
    max_concurrent_episodes: 1
