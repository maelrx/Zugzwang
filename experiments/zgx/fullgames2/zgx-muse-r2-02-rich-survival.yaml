# Muse R2 #2 — RICH1-SURVIVAL: testa a hipótese "sobreviver > calcular":
# lances baratos, sólidos e neutros duram mais plies que busca rasa cara.
# Métrica primária: plies até o mate (comparar direto com r2-01).
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: zgx-muse-r2-02-rich-survival
  tags: [zgx, muse, r2, fullgame, real, stockfish1320]

spec:
  seed: 20260908

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 420
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: medium
        default_max_output_tokens: 8192
      cognitive:
        max_rounds: 2
        preload_root: true
        inline_child_packages: true
        reasoning_memory: factual
        directive: >-
          SOLID DEVELOPMENT: One careful pass. Choose the move that (a) develops
          a piece or improves your worst-placed piece, (b) keeps every pawn in
          front of your king on its current square unless tactically forced,
          (c) does not move into an attacked square, and (d) keeps the position
          without weakening concessions. Avoid speculative sacrifices. If two
          moves look equal, choose the simpler and more solid one. Verify the
          adversary's most natural reply once, then finalize on ROOT via
          board_finalize.

  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 12, notation: uci}
    retries:
      transport: 4
      parse: 2
      illegal: 5

  budget:
    max_calls: 3000
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
