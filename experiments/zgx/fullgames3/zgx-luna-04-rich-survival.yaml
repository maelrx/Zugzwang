# Luna 04 — RICH-SURVIVAL (R2-02 verbatim): hipótese oposta — sobrevivência >
# cálculo. 2 rounds, diretiva SOLID DEVELOPMENT neutra. Se sobreviver ≥ o guard
# com 3× menos calls, o gargalo nunca foi profundidade — era estilo.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: zgx-luna-04-rich-survival
  tags: [zgx, luna, codex, fullgame, real, stockfish1320, high]

spec:
  seed: 20260912

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      backend_config:
        model: gpt-5.6-luna
        timeout_seconds: 420
        reasoning_effort: high
        max_output_tokens: 32768
      cognitive:
        max_rounds: 2
        preload_root: true
        inline_child_packages: true
        reasoning_memory: factual
        directive: >-
          SOLID DEVELOPMENT: One careful pass. Choose the move that (a) develops
          a piece or improves your worst-placed piece, (b) keeps every pawn in
          front of your king on its current square unless tactically forced,
          (c) does not move into an attacked square, and (d) keeps the position
          without weakening concessions. Avoid speculative sacrifices. If two
          moves look equal, choose the simpler and more solid one. Verify the
          adversary's most natural reply once, then finalize on ROOT via
          board_finalize.

  players:
    white:
      model:
        backend: provider.codex_cli
        provider: codex-cli
        model: gpt-5.6-luna
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 12, notation: uci}
    retries:
      transport: 4
      parse: 2
      illegal: 5

  budget:
    max_calls: 3000
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
