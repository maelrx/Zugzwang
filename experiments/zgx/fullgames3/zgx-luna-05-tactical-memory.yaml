# Luna 05 — TACTICAL MEMORY: a diretiva do full-01 (R1) — o setup com a MAIOR
# sobrevivência histórica do muse (64 plies) — sem a cláusula "finalize by
# Round 2" (diagnóstico R1: anula a profundidade; config nunca validada) e com
# 6 rounds completos. Continuidade histórica: mede o quanto a Luna high extrai
# do melhor setup pré-guard.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: zgx-luna-05-tactical-memory
  tags: [zgx, luna, codex, fullgame, real, stockfish1320, high]

spec:
  seed: 20260913

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      backend_config:
        model: gpt-6-astra
        timeout_seconds: 420
        reasoning_effort: high
        max_output_tokens: 32768
      cognitive:
        max_rounds: 6
        preload_root: true
        inline_child_packages: true
        reasoning_memory: factual
        directive: >-
          TACTICAL PRIORITIES & FACTUAL MEMORY: On every turn, examine all
          forcing lines (checks, captures, immediate threats). Expand candidates
          to verify tactical safety. Retain factual tactical memory across
          rounds to avoid blunders. Finalize on ROOT via board_finalize once
          your candidate survives verification.

  players:
    white:
      model:
        backend: provider.codex_cli
        provider: codex-cli
        model: gpt-6-astra
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 12, notation: uci}
    retries:
      transport: 4
      parse: 2
      illegal: 5

  budget:
    max_calls: 3000
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
