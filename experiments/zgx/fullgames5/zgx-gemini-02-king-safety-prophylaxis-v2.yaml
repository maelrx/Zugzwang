# Gemini 3.8 Flash Low 02 — KING SAFETY & PROPHYLAXIS v2
# Upgrade of zgx-full-03 (61-ply checkmate vs SF-1320, Gemini's fastest historic victory)
# with 6 rounds, inline child packages, factual memory, and unconstrained candidate verification.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: zgx-gemini-02-king-safety-prophylaxis-v2
  tags: [zgx, gemini, agy, fullgame, real, stockfish1320, flash-low]

spec:
  seed: 20260915

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      backend_config:
        provider_id: antigravity-cli
        model: gemini-3.8-flash-low
        timeout_seconds: 180
        reasoning_effort: low
        default_max_output_tokens: 8192
      cognitive:
        max_rounds: 6
        preload_root: true
        inline_child_packages: true
        reasoning_memory: factual
        directive: >-
          KING SAFETY SENTINEL & DEEP HISTORY: Prioritize absolute king
          safety and prophylaxis above all else. Evaluate adversary counter-threats
          before launching attacks. Expand candidate moves to verify king
          safety and tactical defense. Retain factual tactical memory across
          rounds to avoid blunders. Finalize on ROOT via board_finalize once
          your candidate is safely verified.

  players:
    white:
      model:
        backend: provider.antigravity_cli
        provider: antigravity-cli
        model: gemini-3.8-flash-low
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 12, notation: uci}
    retries:
      transport: 4
      parse: 2
      illegal: 5

  budget:
    max_calls: 3000
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
