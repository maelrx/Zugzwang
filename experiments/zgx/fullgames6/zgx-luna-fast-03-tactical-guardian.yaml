# Luna Fast 03 — TACTICAL GUARDIAN v2 (melhor jogo do estudo: ACPL 28, 1 blunder)
# Estudo ZGW-0108 portado para luna high + Codex service_tier=fast (ZGW-0113).
# Config campeã do estudo: r6, inline_child, preload_root, factual, hist 12 uci, noascii.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: zgx-luna-fast-03-tactical-guardian
  tags: [zgx, luna, codex, fast, fullgame, real, stockfish1320, high]

spec:
  seed: 20260916

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      model_color: white
      max_plies: null
      backend_config:
        model: gpt-5.6-luna
        timeout_seconds: 420
        reasoning_effort: high
        service_tier: fast
        # ZGW-0118: strict CLI (model-only/v1) rejects legacy model_max_output_tokens.
      cognitive:
        max_rounds: 6
        preload_root: true
        inline_child_packages: true
        reasoning_memory: factual
        directive: >-
          TACTICAL GUARDIAN: (1) List every check, capture and threat available
          to you NOW. (2) For each candidate move, expand the position and check
          the adversary's BEST reply before trusting it — a move is safe only if
          the best reply does not win material or deliver checkmate.
          (3) ANTI-HANG CHECK, MANDATORY: before finalizing, verify your moved
          piece's destination square is adequately defended, and that no
          undefended friendly piece is left exposed to capture.
          (4) Keep king safety: do not expose your king to forced checks.
          (5) Maintain factual tactical memory across rounds to avoid blunders.
          Finalize on ROOT via board_finalize once verified.

  players:
    white:
      model:
        backend: provider.codex_cli
        provider: codex-cli
        model: gpt-5.6-luna
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1320
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 12, notation: uci}
    retries:
      transport: 4
      parse: 2
      illegal: 5

  budget:
    max_calls: 3000
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
