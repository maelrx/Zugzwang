# ZGX-03 onda 1 — N2 | p07-linha_risco (linha_risco) | AB
# Posição-fonte: cb-arena-k:K9. Par pareado; esforço LOW; rota muse congelada.
# tratamento N2: expand devolve o pacote-filho inline.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: zgx03-b-p07-linha_risco
  tags: [zgx, wave1, real, zgx03, linha_risco]

spec:
  seed: 202690006

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: move-selection
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      move_prefix: [e2e4, e7e5, g1f3, b8c6, f1c4, d7d6, c4f7, e8f7, e1g1, f7e8, b1c3, c8g4, d2d4, e5d4, h2h3, g4h5]
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 420
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: low
        default_max_output_tokens: 8192
      cognitive:
        max_rounds: 4
        preload_root: true


  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: fake.stay

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 6, notation: uci}
    retries:
      transport: 4
      parse: 1
      illegal: 4

  budget:
    max_calls: 60
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
