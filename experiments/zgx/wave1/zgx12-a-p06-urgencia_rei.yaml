# ZGX-12 onda 1 — N6-neutro | p06-urgencia_rei (urgencia_rei) | BA
# Posição-fonte: cb-arena-i:I20. Par pareado; esforço LOW; rota muse congelada.
# controle N6 prompt neutro.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: zgx12-a-p06-urgencia_rei
  tags: [zgx, wave1, real, zgx12, urgencia_rei]

spec:
  seed: 202690005

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: move-selection
      start_fen: rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
      move_prefix: [e2e4, d7d5, e4d5, d8d5, g1f3, d5e6, f1e2, g8h6, e1g1, e6g6, f3h4, g6e6, b1c3, g7g5, h4f3, g5g4, e2c4, e6f5, f3d4, f5g6, d2d3, e7e6, d4e6, f7e6, c1h6, g6h6, d1g4, b8c6, c3d5, e6d5, c4d5, c8g4, d5c6, h6c6, c2c4, g4e2, d3d4, h8g8]
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 420
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: low
        default_max_output_tokens: 8192
      cognitive:
        max_rounds: 6
        preload_root: true
        directive: >-
          Choose the best move for the side to move. Use board_observe on the
          root, investigate with board_expand as needed — an expansion returns
          the child's position package, and you may expand FROM a child to
          examine the adversary's reply. Then finalize with board_finalize on
          the ROOT node with the chosen action_id. The legal list order is not
          a quality ranking.


  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: fake.stay

  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 6, notation: uci}
    retries:
      transport: 4
      parse: 1
      illegal: 4

  budget:
    max_calls: 60
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
