# ZGX-20 onda 1 — M0 | p11-final_conversao (memoria_t6) | BA
# Posição-fonte: cb-arena-j:J37. Par pareado; esforço LOW; rota muse congelada.
# T6 M0: episódio de 4 decisões do Muse vs SF congelado.
api_version: zgw.dev/v1alpha1
kind: Experiment

metadata:
  name: zgx20-a-p11-final_conversao
  tags: [zgx, wave1, real, zgx20, memoria_t6]

spec:
  seed: 202680005

  task:
    plugin: chess.tasks
    version: "0.1"
    config:
      cognitive_interaction_mode: native_tools
      kind: full-game
      start_fen: 5rk1/R5p1/4K3/3P4/8/1P3P1p/P2Q1P1P/3R4 w - - 5 37
      model_color: white
      max_plies: 7
      backend_config:
        base_url: http://127.0.0.1:8788/v1
        provider_id: opencode-router
        timeout_seconds: 420
        profile: openai-responses
        allow_private_network: true
        reasoning_effort: low
        default_max_output_tokens: 8192
      cognitive:
        max_rounds: 6
        preload_root: true
        directive: >-
          Choose the best move for the side to move. Use board_observe on the
          root, investigate with board_expand as needed — an expansion returns
          the child's position package, and you may expand FROM a child to
          examine the adversary's reply. Then finalize with board_finalize on
          the ROOT node with the chosen action_id. The legal list order is not
          a quality ranking.


  players:
    white:
      model:
        backend: provider.openai_compatible
        provider: opencode-router
        model: muse-spark-1.3-contributor
        strategy: chess.cognitive_navigation
    black:
      policy:
        plugin: chess.stockfish
        plugin: chess.stockfish
        config:
          executable: /home/maelrx/.local/bin/stockfish
          elo: 1000
          allow_approximate: true
          limit: {nodes: 20000}
          options: {Threads: "1", Hash: "16"}
  protocol:
    declared_assistance: H4
    declared_knowledge: K0
    observation:
      position: {fen: true, ascii: false}
      side_to_move: true
      move_number: true
      history: {mode: last_n, plies: 6, notation: uci}
    retries:
      transport: 4
      parse: 1
      illegal: 4

  budget:
    max_calls: 120
    max_concurrent_episodes: 1
    max_attempts: 1

  evaluation: []

  artifacts:
    raw_requests: true
    raw_responses: true
    redact: standard
