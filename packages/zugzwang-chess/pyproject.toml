[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zugzwang-chess"
version = "0.1.0.dev0"
description = "Zugzwang chess domain: standard chess environment, tasks, codecs, opponents and suites."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "zugzwang-core",
    "python-chess>=1.11",
    "pillow>=10.0",
]

[project.entry-points."zugzwang.environments"]
chess_standard = "zugzwang_chess.plugins:CHESS_ENVIRONMENT_ENTRY"

[project.entry-points."zugzwang.tasks"]
chess_tasks = "zugzwang_chess.plugins:CHESS_TASK_ENTRY"

[project.entry-points."zugzwang.policies"]
chess_random_legal = "zugzwang_chess.plugins:CHESS_POLICY_ENTRY"

[project.entry-points."zugzwang.strategies"]
chess_direct = "zugzwang_chess.plugins:CHESS_STRATEGY_ENTRY"
chess_grounded = "zugzwang_chess.plugins:CHESS_GROUNDED_STRATEGY_ENTRY"
chess_repair = "zugzwang_chess.plugins:CHESS_REPAIR_STRATEGY_ENTRY"
chess_structured = "zugzwang_chess.plugins:CHESS_STRUCTURED_STRATEGY_ENTRY"
chess_reconstruct = "zugzwang_chess.plugins:CHESS_RECONSTRUCT_STRATEGY_ENTRY"

[tool.uv.sources]
zugzwang-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zugzwang_chess"]
