[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zugzwang-provider-antigravity-cli"
version = "0.1.0.dev0"
description = "Zugzwang provider adapter: Antigravity CLI (agy) as an inference backend."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "zugzwang-core",
]

[project.entry-points."zugzwang.providers"]
antigravity_cli = "zgw_provider_antigravity_cli:plugin"

[tool.uv.sources]
zugzwang-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zgw_provider_antigravity_cli"]
