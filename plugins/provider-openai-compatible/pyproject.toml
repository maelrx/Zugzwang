[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zugzwang-provider-openai-compatible"
version = "0.1.0.dev0"
description = "Zugzwang provider adapter: direct httpx client for OpenAI-compatible endpoints."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "zugzwang-core",
    "httpx>=0.28",
]

[project.entry-points."zugzwang.providers"]
openai_compatible = "zgw_provider_openai_compatible:plugin"

[tool.uv.sources]
zugzwang-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zgw_provider_openai_compatible"]
