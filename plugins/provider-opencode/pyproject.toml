[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zugzwang-provider-opencode"
version = "0.1.0.dev0"
description = "Zugzwang provider adapter: opencode headless server as an inference backend."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "zugzwang-core",
    "httpx>=0.28",
]

[project.entry-points."zugzwang.providers"]
opencode = "zgw_provider_opencode:plugin"

[tool.uv.sources]
zugzwang-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zgw_provider_opencode"]
