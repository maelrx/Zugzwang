[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zugzwang-provider-pydantic-ai"
version = "0.1.0.dev0"
description = "Zugzwang provider adapter: Pydantic AI Direct Model Requests behind the canonical contract."
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "zugzwang-core",
    "pydantic-ai>=0.0.50",
]

[project.entry-points."zugzwang.providers"]
pydantic_ai = "zgw_provider_pydantic_ai:plugin"

[tool.uv.sources]
zugzwang-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/zgw_provider_pydantic_ai"]
