[project]
name = "zugzwang"
version = "0.1.0.dev0"
description = "Zugzwang Research Kernel — attribution-first, local-first kernel for reproducible LLM decision experiments"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
readme = "README.md"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.120",
    "ruff>=0.12",
    "pyright>=1.1.390",
    "jsonschema>=4.23",
    "duckdb>=1.2",
    "pyarrow>=18",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["packages/zugzwang-core/src", "packages/zugzwang-runtime/src", "packages/zugzwang-chess/src", "packages/zugzwang-cli/src", "plugins"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "B011"]

[tool.pyright]
include = [
    "packages/zugzwang-core/src",
    "packages/zugzwang-runtime/src",
    "packages/zugzwang-chess/src",
    "packages/zugzwang-cli/src",
    "plugins/provider-openai-compatible/src",
    "plugins/provider-opencode/src",
    "plugins/provider-pydantic-ai/src",
    "plugins/provider-zcode-glm/src",
    "plugins/provider-codex-cli/src",
    "plugins/evaluator-stockfish/src",
    "plugins/reporter-parquet/src",
]
exclude = ["**/tests/**", "**/build/**", "**/.venv/**"]
typeCheckingMode = "strict"
reportUnusedImport = "error"
reportMissingTypeStubs = "none"
extraPaths = [
    "packages/zugzwang-core/src",
    "packages/zugzwang-runtime/src",
    "packages/zugzwang-chess/src",
    "packages/zugzwang-cli/src",
    "plugins/provider-openai-compatible/src",
    "plugins/provider-opencode/src",
    "plugins/provider-pydantic-ai/src",
    "plugins/provider-zcode-glm/src",
    "plugins/provider-codex-cli/src",
    "plugins/evaluator-stockfish/src",
    "plugins/reporter-parquet/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure domain tests, no I/O",
    "architecture: dependency boundary enforcement",
    "contract: port contract suites shared by plugins",
    "integration: sqlite/cas/runner integration",
    "fault: crash and fault injection",
    "compatibility: bundle/schema/migration fixtures",
    "e2e: opt-in tests requiring network, engines or secrets",
]
asyncio_mode = "auto"
addopts = "-m 'not e2e' --strict-markers"

[tool.coverage.run]
source = [
    "packages/zugzwang-core/src",
    "packages/zugzwang-runtime/src",
    "packages/zugzwang-chess/src",
    "packages/zugzwang-cli/src",
]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
