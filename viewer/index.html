<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zugzwang Match Desk</title>
    <style>
      @font-face {
        font-family: "Geist Sans";
        src: url("fonts/GeistSans.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("fonts/GeistMono.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }

      :root {
        --ink: #0e1116;
        --ink-2: #141920;
        --panel: #171d26;
        --panel-2: #1d242f;
        --line: rgba(226, 235, 230, 0.10);
        --line-bright: rgba(226, 235, 230, 0.20);
        --paper: #edf1ee;
        --muted: #8fa0a9;
        --faint: #7d8b94;
        --accent: #e8a865;
        --accent-soft: rgba(232, 168, 101, 0.14);
        --ok: #6fd3ab;
        --ok-soft: rgba(111, 211, 171, 0.13);
        --warn: #e8c268;
        --warn-soft: rgba(232, 194, 104, 0.14);
        --err: #ef8b80;
        --err-soft: rgba(239, 139, 128, 0.14);
        --info: #8eaae9;
        --info-soft: rgba(142, 170, 233, 0.13);
        --board-light: #e9d9bd;
        --board-dark: #a88967;
        --board-hl: #cdd26a;
        --sans: "Geist Sans", "Noto Sans", "Segoe UI", sans-serif;
        --mono: "Geist Mono", "DejaVu Sans Mono", monospace;
        --r-s: 6px;
        --r-m: 10px;
        --gap: 14px;
      }

      * { box-sizing: border-box; }
      html { color-scheme: dark; background: var(--ink); }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--paper);
        background: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; background: none; border: none; }
      button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--line);
        background: rgba(14, 17, 22, 0.92);
        backdrop-filter: blur(8px);
      }
      .brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
      .brand strong { font-size: 15px; letter-spacing: 0.02em; }
      .brand span { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
      .layer-switch {
        display: flex;
        gap: 2px;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: var(--r-s);
        background: var(--ink-2);
      }
      .layer-switch button {
        padding: 5px 14px;
        border-radius: 4px;
        color: var(--muted);
        font-size: 12.5px;
      }
      .layer-switch button[aria-pressed="true"] {
        color: var(--ink);
        background: var(--paper);
        font-weight: 600;
      }
      .layer-switch button:not([aria-pressed="true"]):hover { color: var(--paper); }
      .layer-hint { font-size: 11.5px; color: var(--faint); }
      .topbar .spacer { flex: 1; }
      .snapshot-meta { font-family: var(--mono); font-size: 10.5px; color: var(--faint); text-align: right; }
      .snapshot-meta button { color: var(--accent); font-family: var(--mono); font-size: 10.5px; }
      .snapshot-meta button:hover { text-decoration: underline; }

      .layout {
        display: grid;
        grid-template-columns: 296px minmax(0, 1fr);
        min-height: calc(100vh - 45px);
      }
      @media (max-width: 980px) {
        .layout { grid-template-columns: 1fr; }
        .rail { position: static; height: auto; max-height: 40vh; }
      }

      .rail {
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 45px;
        height: calc(100vh - 45px);
        border-right: 1px solid var(--line);
        background: var(--ink-2);
      }
      .rail-head { padding: 14px 16px 10px; }
      .rail-head input {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: var(--r-s);
        background: var(--ink);
        font-size: 13px;
      }
      .rail-head input::placeholder { color: var(--faint); }
      .rail-summary {
        display: flex;
        justify-content: space-between;
        padding: 0 16px 10px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--faint);
      }
      .run-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
      .run-card {
        display: block;
        width: 100%;
        margin-bottom: 4px;
        padding: 9px 10px;
        border: 1px solid transparent;
        border-radius: var(--r-s);
        text-align: left;
      }
      .run-card:hover { background: var(--panel); }
      .run-card.active { border-color: var(--line-bright); background: var(--panel); }
      .run-card .rc-top { display: flex; align-items: center; gap: 8px; }
      .run-card .rc-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }
      .run-card .rc-sub {
        margin-top: 3px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--faint);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 1px 7px;
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.03em;
      }
      .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
      .badge.b-completed { color: var(--ok); background: var(--ok-soft); }
      .badge.b-completed::before { background: var(--ok); }
      .badge.b-running { color: var(--warn); background: var(--warn-soft); }
      .badge.b-running::before { background: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
      .badge.b-failed { color: var(--err); background: var(--err-soft); }
      .badge.b-failed::before { background: var(--err); }
      @keyframes pulse { 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .badge.b-running::before { animation: none; } }

      .content { padding: 18px 22px 60px; min-width: 0; }

      /* ---------- L0 ---------- */
      .kpi-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: var(--gap);
        margin-bottom: var(--gap);
      }
      .kpi {
        padding: 13px 16px;
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        background: var(--panel);
      }
      .kpi label {
        display: block;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .kpi strong { display: block; margin-top: 4px; font-size: 24px; font-weight: 600; }
      .kpi small { font-size: 11.5px; color: var(--muted); }

      .panel {
        border: 1px solid var(--line);
        border-radius: var(--r-m);
        background: var(--panel);
        overflow: hidden;
      }
      .panel + .panel, .grid + .panel, .panel + .grid { margin-top: var(--gap); }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 16px;
        border-bottom: 1px solid var(--line);
      }
      .panel-head .eyebrow {
        margin: 0;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .panel-head h3 { margin: 1px 0 0; font-size: 14px; font-weight: 600; }
      .panel-head small { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
      .panel-body { padding: 14px 16px; }

      .runs-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
      .runs-table th {
        padding: 7px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--faint);
        font-weight: 500;
      }
      .runs-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
      .runs-table tr:last-child td { border-bottom: none; }
      .runs-table tbody tr { cursor: pointer; }
      .runs-table tbody tr:hover { background: var(--panel-2); }
      .runs-table .num { text-align: right; font-family: var(--mono); font-size: 11.5px; }
      .runs-table .dim { color: var(--muted); }
      .mono { font-family: var(--mono); font-size: 11px; }

      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin-top: var(--gap); }
      @media (max-width: 1200px) { .grid-2 { grid-template-columns: 1fr; } }

      .chart-wrap { position: relative; width: 100%; }
      .chart-wrap svg { display: block; width: 100%; height: auto; }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 0 16px 12px;
        font-size: 11px;
        color: var(--muted);
      }
      .legend .key { display: inline-flex; align-items: center; gap: 6px; }
      .legend .swatch { width: 10px; height: 10px; border-radius: 2px; }

      /* ---------- L1 ---------- */
      .game-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: var(--gap);
      }
      .game-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
      .game-head .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
      .game-head .spacer { flex: 1; }
      .btn {
        padding: 6px 13px;
        border: 1px solid var(--line);
        border-radius: var(--r-s);
        background: var(--panel);
        font-size: 12.5px;
      }
      .btn:hover { border-color: var(--line-bright); }
      .btn.primary { background: var(--paper); border-color: var(--paper); color: var(--ink); font-weight: 600; }

      .game-grid {
        display: grid;
        grid-template-columns: minmax(340px, 480px) minmax(0, 1fr);
        gap: var(--gap);
        align-items: start;
      }
      @media (max-width: 1100px) { .game-grid { grid-template-columns: 1fr; } }

      .board-wrap { position: relative; width: 100%; }
      .board { display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid var(--line-bright); border-radius: 4px; overflow: hidden; }
      .square { position: relative; aspect-ratio: 1; }
      .square.light { background: var(--board-light); }
      .square.dark { background: var(--board-dark); }
      .square .pc { position: absolute; inset: 6%; }
      .square .pc svg { width: 100%; height: 100%; }
      .square.hl-from::after, .square.hl-to::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--board-hl);
        opacity: 0.45;
      }
      .coord { position: absolute; font-family: var(--mono); font-size: 9px; color: rgba(0,0,0,0.55); }
      .coord.file { right: 3px; bottom: 1px; }
      .coord.rank { left: 3px; top: 1px; }
      .square.dark .coord { color: rgba(255,255,255,0.7); }

      .transport { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      .transport .btn { padding: 5px 10px; font-family: var(--mono); font-size: 12px; }
      .transport .range { flex: 1; accent-color: var(--accent); }
      .ply-label { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 64px; text-align: right; }

      .move-list { max-height: 300px; overflow-y: auto; font-family: var(--mono); font-size: 12px; }
      .move-row { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 8px; padding: 3px 12px; align-items: baseline; }
      .move-row:hover { background: var(--panel-2); }
      .move-row.cur { background: var(--accent-soft); }
      .move-row .n { color: var(--faint); }
      .move-row .who { color: var(--muted); }
      .move-row .lat { color: var(--faint); font-size: 10.5px; }
      .move-row .lat.warn { color: var(--warn); }
      .move-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 4px; }
      .move-dot.d-ok { background: var(--ok); }
      .move-dot.d-repaired { background: var(--warn); }
      .move-dot.d-failed { background: var(--err); }

      /* ---------- L2 ---------- */
      .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 22px; }
      .fact label { display: block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
      .fact div { font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
      .events { max-height: 380px; overflow-y: auto; font-family: var(--mono); font-size: 11px; }
      .ev-row { display: grid; grid-template-columns: 74px 210px 1fr; gap: 10px; padding: 3px 12px; border-bottom: 1px solid var(--line); }
      .ev-row:hover { background: var(--panel-2); }
      .ev-row .t { color: var(--faint); }
      .ev-row .ty { color: var(--info); }
      .ev-row .ty.warn { color: var(--warn); }
      .ev-row .ty.err { color: var(--err); }
      .ev-row .pl { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border: 1px solid var(--line-bright);
        border-radius: var(--r-s);
        background: var(--panel-2);
        font-size: 12px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><strong>Zugzwang Match Desk</strong><span>observabilidade · somente leitura</span></div>
      <nav class="layer-switch" role="group" aria-label="Camada de observabilidade">
        <button id="tab-l0" aria-pressed="true">Operação</button>
        <button id="tab-l1" aria-pressed="false">Partida</button>
        <button id="tab-l2" aria-pressed="false">Profundo</button>
      </nav>
      <span class="layer-hint" id="layer-hint">visão de operador: todas as partidas, sinais vitais</span>
      <div class="spacer"></div>
      <div class="snapshot-meta">
        <div id="meta-generated">snapshot —</div>
        <button id="btn-reload" type="button">recarregar dados</button>
      </div>
    </header>

    <div class="layout">
      <aside class="rail">
        <div class="rail-head">
          <input id="search" type="search" placeholder="filtrar por run, modelo, condição…" autocomplete="off" aria-label="Filtrar partidas" />
        </div>
        <div class="rail-summary"><span>partidas</span><span id="run-count">0</span></div>
        <div class="run-list" id="run-list" role="list"></div>
      </aside>
      <main class="content" id="content" tabindex="-1"></main>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="data.js"></script>
    <script src="pieces.js"></script>
    <script>
      "use strict";
      const DATA = window.ZUGZWANG_DATA || { runs: [] };
      const PIECES = window.ZUGZWANG_PIECES || {};
      const $ = (sel, el = document) => el.querySelector(sel);

      const LAYER_HINTS = {
        L0: "visão de operador: todas as partidas, sinais vitais",
        L1: "uma partida: replay, ritmo e consumo por lance",
        L2: "drill-down: configuração, eventos brutos, proveniência",
      };

      const state = {
        layer: "L0",
        runId: null,
        episodeIndex: 0,
        ply: 0,
        playing: false,
        playTimer: null,
        query: "",
      };

      /* ---------- helpers ---------- */
      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }
      function fmtNum(n) {
        if (n == null) return "—";
        return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n);
      }
      function fmtMs(ms) {
        if (ms == null) return "—";
        return ms >= 60000 ? (ms / 60000).toFixed(1) + " min" : ms >= 1000 ? (ms / 1000).toFixed(1) + " s" : ms + " ms";
      }
      function fmtDur(a, b) {
        if (!a || !b) return "—";
        const ms = new Date(b) - new Date(a);
        return fmtMs(ms);
      }
      function hhmm(ts) {
        return ts ? new Date(ts).toISOString().slice(11, 16) : "—";
      }
      function toast(msg) {
        const el = $("#toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(() => el.classList.remove("show"), 1800);
      }

      function modelMoveProviders(episode) {
        // per model-move provider stats + cumulative tokens, only for model actor moves
        const out = [];
        let cumIn = 0, cumOut = 0;
        for (const m of episode.moves || []) {
          const isModel = m.actorKind === "Model";
          if (isModel && m.provider) {
            cumIn += m.provider.tokensIn || 0;
            cumOut += m.provider.tokensOut || 0;
            out.push({
              ply: m.ply,
              san: m.san || m.display,
              latencyMs: m.provider.latencyMs,
              attempts: m.provider.attempts,
              status: m.provider.status,
              tokensIn: m.provider.tokensIn || 0,
              tokensOut: m.provider.tokensOut || 0,
              cumIn,
              cumOut,
            });
          }
        }
        return out;
      }

      function episodeResultBadge(ep) {
        const map = { checkmate: ["b-failed", "mate"], capped: ["b-running", "cap"], in_progress: ["b-running", "ao vivo"], stalemate: ["b-completed", "afogamento"], completed: ["b-completed", "completo"], failed: ["b-failed", "falhou"] };
        const [cls, label] = map[ep.result] || ["b-completed", ep.result || ep.status || "n/a"];
        return `<span class="badge ${cls}">${esc(label)}</span>`;
      }

      /* ---------- board ---------- */
      function fenToBoard(fen) {
        const rows = (fen.split(" ")[0] || "").split("/");
        const squares = [];
        for (let r = 0; r < 8; r++) {
          let file = 0;
          for (const ch of rows[r] || "") {
            if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) { squares.push({ sq: null, light: (r + file) % 2 === 0 }); file++; } }
            else { squares.push({ piece: ch, light: (r + file) % 2 === 0, rank: 8 - r, file: file }); file++; }
          }
        }
        return squares;
      }
      const SQUARE_NAME = (i) => "abcdefgh"[i % 8] + (8 - Math.floor(i / 8));
      function renderBoard(fen, lastMove) {
        const squares = fenToBoard(fen);
        const hlFrom = lastMove ? lastMove.slice(0, 2) : null;
        const hlTo = lastMove ? lastMove.slice(2, 4) : null;
        return `<div class="board" aria-label="posição">${squares.map((s, i) => {
          const name = SQUARE_NAME(i);
          const hl = name === hlFrom ? " hl-from" : name === hlTo ? " hl-to" : "";
          const piece = s.piece ? `<span class="pc">${PIECES[s.piece] || ""}</span>` : "";
          const coord = i % 8 === 7 ? `<span class="coord file">${"abcdefgh"[i % 8]}</span>` : "";
          const coordR = Math.floor(i / 8) === 7 ? `<span class="coord rank">${8 - Math.floor(i / 8)}</span>` : "";
          return `<div class="square ${s.light ? "light" : "dark"}${hl}" title="${name}">${piece}${coord}${coordR}</div>`;
        }).join("")}</div>`;
      }

      /* ---------- inline charts (SVG, sem dependências) ---------- */
      function sparkline(points, { w = 560, h = 120, color = "var(--accent)", zeroLine = false, yLabel } = {}) {
        if (!points.length) return `<div class="empty">sem dados</div>`;
        const vals = points.map((p) => p.v);
        let min = Math.min(...vals, zeroLine ? 0 : Infinity);
        let max = Math.max(...vals, zeroLine ? 0 : -Infinity);
        if (max === min) { max += 1; min -= 1; }
        const pad = 8;
        const x = (i) => pad + (i / Math.max(1, points.length - 1)) * (w - 2 * pad);
        const y = (v) => pad + (1 - (v - min) / (max - min)) * (h - 2 * pad);
        const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
        const area = `${path}L${x(points.length - 1).toFixed(1)},${h - pad}L${x(0).toFixed(1)},${h - pad}Z`;
        const zero = zeroLine && min < 0 && max > 0 ? `<line x1="${pad}" x2="${w - pad}" y1="${y(0)}" y2="${y(0)}" stroke="var(--faint)" stroke-dasharray="3 4"/>` : "";
        const label = yLabel ? `<text x="${pad}" y="12" fill="var(--faint)" font-size="9" font-family="var(--mono)">${esc(yLabel)}</text>` : "";
        return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(yLabel || "série")}">
          ${label}${zero}
          <path d="${area}" fill="${color}" opacity="0.12"/>
          <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6"/>
          ${points.map((p, i) => p.hl ? `<circle cx="${x(i)}" cy="${y(p.v)}" r="2.6" fill="${p.hlColor || color}"/>` : "").join("")}
        </svg></div>`;
      }

      function bars(data, { w = 560, h = 120, color = "var(--info)", yLabel } = {}) {
        if (!data.length) return `<div class="empty">sem dados</div>`;
        const max = Math.max(...data.map((d) => d.v), 1);
        const pad = 8;
        const bw = (w - 2 * pad) / data.length;
        const label = yLabel ? `<text x="${pad}" y="12" fill="var(--faint)" font-size="9" font-family="var(--mono)">${esc(yLabel)}</text>` : "";
        return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(yLabel || "barras")}">${label}
          ${data.map((d, i) => {
            const bh = Math.max(1, (d.v / max) * (h - 2 * pad));
            return `<rect x="${(pad + i * bw + bw * 0.15).toFixed(1)}" y="${(h - pad - bh).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5" fill="${d.c || color}" ${d.title ? `<title>${esc(d.title)}</title>` : ""}/>`;
          }).join("")}
        </svg></div>`;
      }

      function dualArea(points, { w = 560, h = 130 } = {}) {
        if (!points.length) return `<div class="empty">sem dados</div>`;
        const maxIn = Math.max(...points.map((p) => p.cumIn), 1);
        const maxOut = Math.max(...points.map((p) => p.cumOut), 1);
        const max = Math.max(maxIn, maxOut);
        const pad = 8;
        const x = (i) => pad + (i / Math.max(1, points.length - 1)) * (w - 2 * pad);
        const y = (v) => pad + (1 - v / max) * (h - 2 * pad);
        const line = (key, color) => {
          const path = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join("");
          return `<path d="${path}L${x(points.length - 1)},${h - pad}L${x(0)},${h - pad}Z" fill="${color}" opacity="0.12"/><path d="${path}" fill="none" stroke="${color}" stroke-width="1.6"/>`;
        };
        return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="tokens acumulados">
          ${line("cumIn", "var(--info)")}${line("cumOut", "var(--accent)")}
        </svg></div>`;
      }

      /* ---------- data shaping ---------- */
      function runStats(run) {
        const eps = run.episodes || [];
        const moves = eps.flatMap((e) => e.moves || []);
        const modelMoves = moves.filter((m) => m.actorKind === "Model");
        const provs = modelMoves.map((m) => m.provider).filter(Boolean);
        return {
          eps,
          plies: moves.length,
          modelMoves: modelMoves.length,
          calls: provs.length,
          attempts: provs.reduce((s, p) => s + p.attempts, 0),
          repaired: provs.filter((p) => p.status === "repaired").length,
          timeouts: provs.filter((p) => p.status === "timeout_unknown").length,
          tokensIn: provs.reduce((s, p) => s + (p.tokensIn || 0), 0) || run.provider?.tokens?.input || 0,
          tokensOut: provs.reduce((s, p) => s + (p.tokensOut || 0), 0) || run.provider?.tokens?.output || 0,
          latencies: provs.map((p) => p.latencyMs).filter((v) => v != null),
        };
      }

      function filteredRuns() {
        const q = state.query.trim().toLowerCase();
        if (!q) return DATA.runs;
        return DATA.runs.filter((r) =>
          [r.id, r.experiment, r.conditionId, r.model?.model, r.status, ...(r.tags || [])]
            .join(" ").toLowerCase().includes(q));
      }

      function selectRun(id, layer) {
        state.runId = id;
        state.episodeIndex = 0;
        state.ply = 0;
        stopPlay();
        setLayer(layer || (state.layer === "L0" ? "L1" : state.layer));
      }

      /* ---------- layers ---------- */
      function setLayer(layer) {
        state.layer = layer;
        for (const [id, key] of [["tab-l0", "L0"], ["tab-l1", "L1"], ["tab-l2", "L2"]]) {
          $("#" + id).setAttribute("aria-pressed", String(key === layer));
        }
        $("#layer-hint").textContent = LAYER_HINTS[layer];
        if (layer !== "L0" && !state.runId && DATA.runs.length) state.runId = DATA.runs[0].id;
        render();
      }

      function render() {
        stopPlay();
        if (state.layer === "L0") renderL0();
        else if (state.layer === "L1") renderL1();
        else renderL2();
      }

      /* ---------- L0 ---------- */
      function renderL0() {
        const runs = filteredRuns();
        const totals = runs.reduce((acc, r) => {
          const s = runStats(r);
          acc.plies += s.plies; acc.calls += s.calls; acc.tokensIn += s.tokensIn; acc.tokensOut += s.tokensOut;
          if (r.status === "RUNNING") acc.running++;
          if (r.status === "COMPLETED") acc.completed++;
          return acc;
        }, { plies: 0, calls: 0, tokensIn: 0, tokensOut: 0, running: 0, completed: 0 });

        const rows = runs.map((r) => {
          const s = runStats(r);
          const dur = fmtDur(r.startedAt, r.finishedAt || DATA.generatedAt);
          const lastEp = s.eps[s.eps.length - 1];
          return `<tr data-run="${esc(r.id)}" tabindex="0">
            <td>${r.status === "RUNNING" ? '<span class="badge b-running">live</span>' : r.status === "COMPLETED" ? '<span class="badge b-completed">ok</span>' : '<span class="badge b-failed">' + esc(r.status.toLowerCase()) + "</span>"}</td>
            <td><div>${esc((r.experiment || "").slice(0, 34))}</div><small class="mono dim">${esc(r.id.slice(4, 14))} · ${esc(r.model?.model || "?")}</small></td>
            <td>${lastEp ? episodeResultBadge(lastEp) : "—"}</td>
            <td class="num">${s.plies}</td>
            <td class="num">${s.calls}</td>
            <td class="num">${fmtNum(s.tokensIn)}/${fmtNum(s.tokensOut)}</td>
            <td class="num dim">${dur}</td>
          </tr>`;
        }).join("");

        const byExp = {};
        for (const r of DATA.runs) {
          const key = (r.experiment || "?").slice(0, 22);
          byExp[key] = (byExp[key] || 0) + runStats(r).plies;
        }
        const expBars = Object.entries(byExp).sort((a, b) => b[1] - a[1]).slice(0, 8)
          .map(([k, v]) => ({ v, title: `${k}: ${v} lances`, c: "var(--info)" }));

        const tok = runs.map((r) => {
          const s = runStats(r);
          return { v: s.tokensIn + s.tokensOut, title: `${r.id.slice(4, 14)}: ${fmtNum(s.tokensIn + s.tokensOut)} tokens` };
        }).sort((a, b) => b.v - a.v).slice(0, 8).map((d) => ({ ...d, c: "var(--accent)" }));

        $("#content").innerHTML = `
          <section class="kpi-strip">
            <div class="kpi"><label>partidas no recorte</label><strong>${runs.length}</strong><small>${totals.running} live · ${totals.completed} completas</small></div>
            <div class="kpi"><label>lances totais</label><strong>${totals.plies}</strong><small>todos os episódios</small></div>
            <div class="kpi"><label>calls ao modelo</label><strong>${totals.calls}</strong><small>uma por decisão</small></div>
            <div class="kpi"><label>tokens in/out</label><strong>${fmtNum(totals.tokensIn)}/${fmtNum(totals.tokensOut)}</strong><small>somados sobre todos os runs</small></div>
          </section>

          <section class="panel">
            <div class="panel-head"><div><p class="eyebrow">operador · tudo</p><h3>Partidas</h3></div><small>clique para abrir na camada Partida</small></div>
            <table class="runs-table">
              <thead><tr><th></th><th>run / modelo</th><th>resultado</th><th class="num">plies</th><th class="num">calls</th><th class="num">tokens i/o</th><th class="num">duração</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="7" class="dim">nenhuma partida no recorte</td></tr>'}</tbody>
            </table>
          </section>

          <div class="grid-2">
            <section class="panel">
              <div class="panel-head"><div><p class="eyebrow">distribuição</p><h3>Lances por experimento</h3></div><small>top 8</small></div>
              <div class="panel-body">${bars(expBars, { yLabel: "plies" })}</div>
              <div class="legend"><span class="key"><span class="swatch" style="background:var(--info)"></span>lances acumulados</span></div>
            </section>
            <section class="panel">
              <div class="panel-head"><div><p class="eyebrow">consumo</p><h3>Tokens por run</h3></div><small>top 8 · in+out</small></div>
              <div class="panel-body">${bars(tok, { yLabel: "tokens" })}</div>
              <div class="legend"><span class="key"><span class="swatch" style="background:var(--accent)"></span>tokens somados</span></div>
            </section>
          </div>`;

        for (const tr of $("#content").querySelectorAll("tr[data-run]")) {
          const open = () => selectRun(tr.dataset.run, "L1");
          tr.addEventListener("click", open);
          tr.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
        }
      }

      /* ---------- L1 ---------- */
      function renderL1() {
        const run = DATA.runs.find((r) => r.id === state.runId) || DATA.runs[0];
        if (!run) { $("#content").innerHTML = '<div class="empty">sem runs</div>'; return; }
        const ep = (run.episodes || [])[state.episodeIndex] || run.episodes?.[0];
        if (!ep) { $("#content").innerHTML = '<div class="empty">sem episódios</div>'; return; }
        const s = runStats(run);
        const prov = modelMoveProviders(ep);
        const move = ep.moves?.[state.ply - 1];
        const fen = state.ply === 0 ? ep.positions?.[0]?.fen : move?.fenAfter || ep.positions?.[state.ply]?.fen;
        const lastUci = move?.uci;
        const curMove = ep.moves?.[state.ply - 1];

        const sanLines = [];
        for (let i = 0; i < (ep.moves || []).length; i += 2) {
          const w = ep.moves[i], b = ep.moves[i + 1];
          sanLines.push(`${i / 2 + 1}. ${esc(w?.san || "?")} ${esc(b?.san || "")}`);
        }

        const latPts = prov.map((p) => ({ v: p.latencyMs / 1000, hl: p.status !== "ok", hlColor: p.status === "repaired" ? "var(--warn)" : "var(--err)" }));
        const tokPts = prov.map((p) => ({ v: p.cumOut }));

        $("#content").innerHTML = `
          <div class="game-head">
            <h2>${esc((run.experiment || "").slice(0, 44))}</h2>
            <span class="meta">${esc(run.id)}</span>
            ${r_STATUS(run)}
            <div class="spacer"></div>
            <button class="btn" id="btn-l0">← operação</button>
            <button class="btn primary" id="btn-l2">profundo →</button>
          </div>
          <div class="game-grid">
            <section class="panel">
              <div class="panel-head"><div><p class="eyebrow">posição</p><h3>Tabuleiro</h3></div>
                <select id="ep-select" class="btn" aria-label="Episódio">${(run.episodes || []).map((e, i) => `<option value="${i}" ${i === state.episodeIndex ? "selected" : ""}>ep ${i + 1} · ${esc(e.result || e.status || "?")}</option>`).join("")}</select>
              </div>
              <div class="panel-body">
                ${renderBoard(fen, lastUci)}
                <div class="transport">
                  <button class="btn" id="b-first" title="primeiro">|◀</button>
                  <button class="btn" id="b-prev" title="anterior">◀</button>
                  <button class="btn primary" id="b-play">${state.playing ? "pausar" : "reproduzir"}</button>
                  <button class="btn" id="b-next" title="próximo">▶</button>
                  <button class="btn" id="b-last" title="último">▶|</button>
                  <input class="range" id="ply-range" type="range" min="0" max="${(ep.moves || []).length}" value="${state.ply}" aria-label="ply"/>
                  <span class="ply-label" id="ply-label">${state.ply}/${(ep.moves || []).length}</span>
                </div>
                <div style="margin-top:8px" id="move-caption">
                  ${state.ply === 0 ? '<small class="dim">posição inicial</small>' : `<small class="mono">${esc(curMove?.side || "")} · ${esc(curMove?.san || curMove?.display || "")} · ${esc(curMove?.actorKind || "")}</small>`}
                </div>
              </div>
            </section>

            <div style="display:grid; gap:var(--gap); min-width:0">
              <section class="panel">
                <div class="panel-head"><div><p class="eyebrow">ritmo do modelo</p><h3>Latência por decisão</h3></div><small>${prov.length} decisões · pico ${fmtMs(Math.max(0, ...prov.map((p) => p.latencyMs || 0)))}</small></div>
                <div class="panel-body">${sparkline(latPts, { color: "var(--info)", yLabel: "segundos por call do modelo" })}</div>
                <div class="legend">
                  <span class="key"><span class="swatch" style="background:var(--info)"></span>latência</span>
                  <span class="key"><span class="swatch" style="background:var(--warn)"></span>reparada</span>
                  <span class="key"><span class="swatch" style="background:var(--err)"></span>falha/timeout</span>
                </div>
              </section>
              <section class="panel">
                <div class="panel-head"><div><p class="eyebrow">consumo acumulado</p><h3>Tokens por decisão</h3></div><small>in ${fmtNum(prov.reduce((a, p) => a + p.tokensIn, 0))} · out ${fmtNum(prov.reduce((a, p) => a + p.tokensOut, 0))}</small></div>
                <div class="panel-body">${dualArea(prov)}</div>
                <div class="legend">
                  <span class="key"><span class="swatch" style="background:var(--info)"></span>tokens in acumulados</span>
                  <span class="key"><span class="swatch" style="background:var(--accent)"></span>tokens out acumulados</span>
                </div>
              </section>
            </div>
          </div>

          <div class="grid-2">
            <section class="panel">
              <div class="panel-head"><div><p class="eyebrow">partida</p><h3>Lances</h3></div><small>${sanLines.length} lances do modelo</small></div>
              <div class="move-list" id="move-list">${(ep.moves || []).map((m, i) => `
                <div class="move-row ${i === state.ply - 1 ? "cur" : ""}" data-ply="${i + 1}" tabindex="0">
                  <span class="n">${Math.floor(i / 2) + 1}${m.side === "White" ? "." : "…"}</span>
                  <span><span class="move-dot ${m.provider ? "d-" + (m.provider.status === "ok" ? "ok" : m.provider.status === "repaired" ? "repaired" : "failed") : ""}" title="${esc(m.actorKind)}"></span>${esc(m.san || m.display)}</span>
                  <span class="who">${esc(m.actorKind === "Model" ? "modelo" : m.actorKind === "Stockfish" ? "SF" : "—")}</span>
                  <span class="lat ${m.provider && m.provider.latencyMs > 60000 ? "warn" : ""}">${m.provider ? fmtMs(m.provider.latencyMs) : ""}</span>
                </div>`).join("")}</div>
            </section>
            <section class="panel">
              <div class="panel-head"><div><p class="eyebrow">notação</p><h3>PGN curto</h3></div><small>cópia rápida</small></div>
              <div class="panel-body"><div class="mono" style="line-height:1.9; word-spacing:4px">${sanLines.join(" ")}</div></div>
              <div class="panel-head"><div><p class="eyebrow">episódio</p><h3>Sinais</h3></div><small>${episodeResultBadge(ep)}</small></div>
              <div class="panel-body">
                <div class="facts">
                  <div class="fact"><label>resultado</label><div>${esc(ep.result || "—")}${ep.winner ? " · vence " + esc(ep.winner) : ""}</div></div>
                  <div class="fact"><label>duração</label><div>${fmtDur(run.startedAt, run.finishedAt || DATA.generatedAt)}</div></div>
                  <div class="fact"><label>calls do modelo</label><div>${s.calls} (attempts ${s.attempts})</div></div>
                  <div class="fact"><label>reparos / timeouts</label><div>${s.repaired} / ${s.timeouts}</div></div>
                  <div class="fact"><label>tokens in/out</label><div>${fmtNum(s.tokensIn)} / ${fmtNum(s.tokensOut)}</div></div>
                  <div class="fact"><label>protocolo</label><div class="mono">${esc((run.protocolHash || "").slice(0, 12))}…</div></div>
                </div>
              </div>
            </section>
          </div>`;

        wireGame(run, ep);
      }

      function r_STATUS(run) {
        return run.status === "RUNNING" ? '<span class="badge b-running">live</span>' : run.status === "COMPLETED" ? '<span class="badge b-completed">completa</span>' : `<span class="badge b-failed">${esc(run.status.toLowerCase())}</span>`;
      }

      function wireGame(run, ep) {
        const max = (ep.moves || []).length;
        const goto = (p) => { state.ply = Math.max(0, Math.min(max, p)); render(); };
        $("#b-first").onclick = () => goto(0);
        $("#b-prev").onclick = () => goto(state.ply - 1);
        $("#b-next").onclick = () => goto(state.ply + 1);
        $("#b-last").onclick = () => goto(max);
        $("#b-play").onclick = () => { state.playing = !state.playing; if (state.playing) { state.playTimer = setInterval(() => { if (state.ply >= max) { stopPlay(); render(); } else { state.ply++; render(); } }, 900); } else stopPlay(); render(); };
        $("#ply-range").oninput = (e) => goto(+e.target.value);
        $("#ep-select").onchange = (e) => { state.episodeIndex = +e.target.value; state.ply = 0; render(); };
        $("#btn-l0").onclick = () => setLayer("L0");
        $("#btn-l2").onclick = () => setLayer("L2");
        for (const row of $("#move-list").querySelectorAll("[data-ply]")) {
          row.addEventListener("click", () => goto(+row.dataset.ply));
          row.addEventListener("keydown", (e) => { if (e.key === "Enter") goto(+row.dataset.ply); });
        }
      }
      function stopPlay() {
        if (state.playTimer) { clearInterval(state.playTimer); state.playTimer = null; }
        state.playing = false;
      }

      /* ---------- L2 ---------- */
      function renderL2() {
        const run = DATA.runs.find((r) => r.id === state.runId) || DATA.runs[0];
        if (!run) { $("#content").innerHTML = '<div class="empty">sem runs</div>'; return; }
        const s = runStats(run);
        const events = (run.events || []).slice(-140).reverse();
        const evClass = (t) => t.includes("failed") || t.includes("illegal") || t.includes("timeout") ? "err" : t.includes("completed") ? "" : "warn";

        $("#content").innerHTML = `
          <div class="game-head">
            <h2>Profundo · ${esc((run.experiment || "").slice(0, 34))}</h2>
            <span class="meta">${esc(run.id)}</span>
            <div class="spacer"></div>
            <button class="btn" id="btn-l1">← partida</button>
          </div>

          <section class="panel">
            <div class="panel-head"><div><p class="eyebrow">proveniência</p><h3>Quem jogou o quê</h3></div><small>${esc(run.status)}</small></div>
            <div class="panel-body"><div class="facts">
              <div class="fact"><label>run</label><div class="mono">${esc(run.id)}</div></div>
              <div class="fact"><label>condição</label><div class="mono">${esc(run.conditionId || "")}</div></div>
              <div class="fact"><label>protocol hash</label><div class="mono">${esc(run.protocolHash || "")}</div></div>
              <div class="fact"><label>assistência</label><div>${esc(run.declaredAssistance || "—")} declarada · ${esc(run.effectiveAssistance || "—")} efetiva</div></div>
              <div class="fact"><label>janela</label><div>${hhmm(run.startedAt)} → ${hhmm(run.finishedAt)} UTC</div></div>
              <div class="fact"><label>modelo</label><div class="mono">${esc(run.model?.model || JSON.stringify(run.model || {}))}</div></div>
              <div class="fact"><label>oponente</label><div class="mono">${esc(JSON.stringify(run.opponents?.[0]?.policy || {}).slice(0, 90))}</div></div>
              <div class="fact"><label>orçamento</label><div class="mono">max_calls ${esc(run.budget?.max_calls ?? "null")}</div></div>
              <div class="fact"><label>custo</label><div>${esc(run.provider?.costStatus || "unknown")}</div></div>
              <div class="fact"><label>tags</label><div>${(run.tags || []).map((t) => `<span class="mono">${esc(t)}</span>`).join(" · ") || "—"}</div></div>
            </div></div>
          </section>

          <div class="grid-2">
            <section class="panel">
              <div class="panel-head"><div><p class="eyebrow">configuração efetiva</p><h3>Task & strategy</h3></div><small>redigido</small></div>
              <div class="panel-body"><pre class="mono" style="white-space:pre-wrap; margin:0">${esc(JSON.stringify(run.task, null, 1))}</pre></div>
            </section>
            <section class="panel">
              <div class="panel-head"><div><p class="eyebrow">sinais operacionais</p><h3>Resumo técnico</h3></div></div>
              <div class="panel-body"><div class="facts">
                <div class="fact"><label>lances / episódios</label><div>${s.plies} / ${s.eps.length}</div></div>
                <div class="fact"><label>provider calls ok</label><div>${s.calls}</div></div>
                <div class="fact"><label>attempts totais</label><div>${s.attempts}</div></div>
                <div class="fact"><label>latência média (modelo)</label><div>${s.latencies.length ? fmtMs(s.latencies.reduce((a, b) => a + b, 0) / s.latencies.length) : "—"}</div></div>
                <div class="fact"><label>latência p95 (modelo)</label><div>${s.latencies.length ? fmtMs(s.latencies.slice().sort((a, b) => a - b)[Math.floor(s.latencies.length * 0.95)] ) : "—"}</div></div>
                <div class="fact"><label>eventos</label><div>${(run.events || []).length}</div></div>
              </div></div>
            </section>
          </div>

          <section class="panel">
            <div class="panel-head"><div><p class="eyebrow">linha do tempo</p><h3>Eventos brutos</h3></div><small>últimos 140 · mais recentes primeiro</small></div>
            <div class="events">${events.map((e) => `
              <div class="ev-row"><span class="t">${hhmm(e.at)}</span><span class="ty ${evClass(e.type)}">${esc(e.type)}</span><span class="pl">${esc(JSON.stringify(e.payload || {}).slice(0, 120))}</span></div>`).join("") || '<div class="empty">sem eventos</div>'}</div>
          </section>`;

        $("#btn-l1").onclick = () => setLayer("L1");
      }

      /* ---------- rail ---------- */
      function renderRail() {
        const runs = filteredRuns();
        $("#run-count").textContent = runs.length;
        $("#run-list").innerHTML = runs.map((r, i) => `
          <button class="run-card ${r.id === state.runId ? "active" : ""}" data-run-id="${esc(r.id)}" role="listitem">
            <div class="rc-top">${r.status === "RUNNING" ? '<span class="badge b-running">live</span>' : r.status === "COMPLETED" ? '<span class="badge b-completed">ok</span>' : '<span class="badge b-failed">!</span>'}<span class="rc-name">${esc((r.experiment || "?").slice(0, 26))}</span></div>
            <div class="rc-sub">${esc(r.id.slice(4, 16))} · ${esc(r.model?.model || "?")}</div>
          </button>`).join("");
        for (const card of $("#run-list").querySelectorAll("[data-run-id]")) {
          card.addEventListener("click", () => selectRun(card.dataset.runId));
        }
      }

      /* ---------- boot ---------- */
      $("#meta-generated").textContent = "snapshot " + (DATA.generatedAt || "").slice(0, 16).replace("T", " ") + "Z";
      $("#btn-reload").addEventListener("click", () => location.reload());
      $("#search").addEventListener("input", (e) => { state.query = e.target.value; renderRail(); if (state.layer === "L0") renderL0(); });
      for (const [id, layer] of [["tab-l0", "L0"], ["tab-l1", "L1"], ["tab-l2", "L2"]]) {
        $("#" + id).addEventListener("click", () => setLayer(layer));
      }
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (state.layer === "L1") {
          if (e.key === "ArrowLeft") { state.ply = Math.max(0, state.ply - 1); render(); }
          if (e.key === "ArrowRight") { state.ply = Math.min((DATA.runs.find((r) => r.id === state.runId)?.episodes?.[state.episodeIndex]?.moves || []).length, state.ply + 1); render(); }
          if (e.key === " ") { e.preventDefault(); $("#b-play")?.click(); }
          if (e.key === "Escape") setLayer("L0");
        }
      });
      renderRail();
      render();
    </script>
  </body>
</html>
