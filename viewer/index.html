            "fake-smoke": "Smoke fake",
          };
          return known[name] || name.replace(/-/g, " ");
        }

        function shortActor(value) {
          const actor = String(value || "");
          if (actor.includes("muse-spark-1.3-contributor-free")) return "MuseSpark 1.3 Free";
          if (actor.startsWith("chess.stockfish")) return "Stockfish";
          if (actor.startsWith("model-opponent/")) return "MuseSpark · self-play";
          if (actor.startsWith("chess.random")) return "random legal";
          return actor;
        }

        /* ---------- snapshot state ---------- */

        function runById(id) { return DATA.runs.find((run) => run.id === id) || null; }
        function currentRun() { return runById(state.runId) || DATA.runs[0] || null; }

        function currentEpisode(run) {
          return run?.episodes?.[state.episodeIndex] || run?.episodes?.[0] || { positions: [{ ply: 0, fen: null }], moves: [] };
        }

        function runHasEval(run) {
          return (run.metrics || []).some((m) => m.metric === "chess.cpl" && m.valueNum !== null && m.valueNum !== undefined);
        }

        function syncUrl() {
          const params = new URLSearchParams();
          if (state.runId) params.set("run", state.runId);
          if (state.view !== "replay") params.set("view", state.view);
          if (state.episodeIndex) params.set("episode", String(state.episodeIndex));
          if (state.ply) params.set("ply", String(state.ply));
          if (state.query) params.set("q", state.query);
          if (state.filter !== "all") params.set("status", state.filter);
          if (state.compare.length) params.set("cmp", state.compare.join(","));
          const query = params.toString();
          history.replaceState(null, "", `${location.pathname}${query ? `?${query}` : ""}`);
        }

        function restoreUrlState(defaultRunId) {
          const params = new URLSearchParams(location.search);
          const requestedRun = params.get("run");
          state.runId = DATA.runs.some((run) => run.id === requestedRun) ? requestedRun : defaultRunId;
          state.query = params.get("q") || "";
          const requestedFilter = params.get("status");
          state.filter = ["all", "COMPLETED", "FAILED", "CANCELED", "eval"].includes(requestedFilter) ? requestedFilter : "all";
          state.view = params.get("view") === "analysis" || params.get("view") === "compare" ? params.get("view") : "replay";
          state.compare = String(params.get("cmp") || "").split(",").map((s) => s.trim()).filter((id) => DATA.runs.some((run) => run.id === id)).slice(0, 4);
          state.episodeIndex = Math.max(0, Number(params.get("episode") || 0));
          state.ply = Math.max(0, Number(params.get("ply") || 0));
          $("#search").value = state.query;
          document.querySelectorAll("[data-filter]").forEach((button) => button.classList.toggle("active", button.dataset.filter === state.filter));
        }

        function snapshotAge() {
          if (!DATA.generatedAt) return "idade desconhecida";
          const minutes = Math.max(0, Math.round((Date.now() - new Date(DATA.generatedAt).getTime()) / 60000));
          if (minutes < 1) return "gerado agora mesmo";
          if (minutes < 60) return `gerado há ${minutes} min`;
          const hours = Math.floor(minutes / 60);
          if (hours < 48) return `gerado há ${hours} h`;
          return `gerado há ${Math.floor(hours / 24)} d`;
        }

        function renderSnapshotCard() {
          const evaluated = DATA.runs.filter(runHasEval).length;
          $("#snapshot-detail").innerHTML =
            `${DATA.runs.length} runs · ${evaluated} com CPL<br />${escapeHtml(snapshotAge())} · poll a cada 15 s`;
        }

        /* ---------- auto-refresh (poll meta.json, never force-reload) ---------- */

        async function pollSnapshot() {
          let meta = null;
          try {
            const response = await fetch("meta.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`http ${response.status}`);
            meta = await response.json();
          } catch {
            $("#poll-state").textContent = "auto-refresh: meta.json ausente (rebuild gera o arquivo)";
            $("#snapshot-dot").className = "live-dot off";
            renderSnapshotCard();
            return;
          }
          $("#poll-state").textContent = `auto-refresh: ativo · ${meta.runs ?? "?"} runs na origem`;
          if (!state.snapshotSha) {
            state.snapshotSha = meta.sha256 || null;
            $("#snapshot-dot").className = "live-dot";
            renderSnapshotCard();
            return;
          }
          if (meta.sha256 && meta.sha256 !== state.snapshotSha) {
            $("#update-pill").classList.add("show");
            $("#snapshot-dot").className = "live-dot stale";
            $("#snapshot-detail").innerHTML =
              `nova snapshot na origem (${escapeHtml(String(meta.runs ?? "?"))} runs)<br />seu replay está preservado — atualize quando quiser`;
          }
        }

        function reloadSnapshot() {
          const pill = $("#update-pill");
          pill.textContent = "carregando nova snapshot…";
          pill.disabled = true;
          const script = document.createElement("script");
          const bust = Date.now().toString(36);
          script.src = `data.js?sha=${bust}`;
          script.onload = () => {
            DATA = window.ZUGZWANG_DATA || DATA;
            if (!runById(state.runId)) {
              state.runId = DATA.runs[0]?.id || null;
              state.episodeIndex = 0;
              state.ply = 0;
            }
            state.compare = state.compare.filter((id) => runById(id));
            state.snapshotSha = null;
            pill.classList.remove("show");
            pill.disabled = false;
            pill.textContent = "↓ nova snapshot — atualizar sem perder o replay";
            $("#snapshot-dot").className = "live-dot";
            stopPlayback();
            renderAll();
            syncUrl();
            pollSnapshot();
          };
          script.onerror = () => {
            pill.textContent = "falha ao carregar — tentar de novo";
            pill.disabled = false;
          };
          document.head.appendChild(script);
          const old = $("#zgw-data");
          if (old) old.remove();
          script.id = "zgw-data";
        }

        /* ---------- run list ---------- */

        function statusHtml(status) {
          const normalized = String(status || "desconhecido").toLowerCase();
          return `<span class="status-dot ${normalized}">${escapeHtml(status || "desconhecido")}</span>`;
        }

        function filteredRuns() {
          const query = state.query.trim().toLowerCase();
          return DATA.runs.filter((run) => {
            const matchesFilter = state.filter === "all"
              || (state.filter === "eval" ? runHasEval(run) : run.status === state.filter);
            const haystack = [run.id, run.experiment, run.conditionId, run.model?.model, run.model?.provider, ...(run.tags || [])].join(" ").toLowerCase();
            return matchesFilter && (!query || haystack.includes(query));
          });
        }

        function renderRunList() {
          const runs = filteredRuns();
          $("#run-count").textContent = `${runs.length}/${DATA.runs.length}`;
          $("#run-list").innerHTML = runs.length ? runs.map((run, index) => {
            const plies = run.episodes?.reduce((sum, episode) => sum + (episode.stepsCommitted || 0), 0) || 0;
            const evalBadge = runHasEval(run) ? `<span class="run-card-meta good">CPL ✓</span>` : `<span class="run-card-meta">sem CPL</span>`;
            const pinned = state.compare.includes(run.id);
            return `
            <div class="run-card ${run.id === state.runId && state.view !== "compare" ? "active" : ""} ${pinned ? "pinned" : ""}" data-run-id="${escapeHtml(run.id)}" role="button" tabindex="0" aria-label="${escapeHtml(prettyExperiment(run.experiment))}" style="animation-delay:${Math.min(index * 24, 300)}ms">
              <div class="run-card-top"><span class="run-card-title">${escapeHtml(prettyExperiment(run.experiment))}</span>${statusHtml(run.status)}</div>
              <div class="run-card-id">${escapeHtml(shortId(run.id))}</div>
              <div class="run-card-bottom"><span class="run-card-meta">${formatNumber(plies)} plies · ${formatDate(run.startedAt)}</span>${evalBadge}</div>
              <div class="run-card-bottom"><button class="pin-btn ${pinned ? "on" : ""}" data-pin-id="${escapeHtml(run.id)}" title="Fixar para comparar (máx. 4)">📌 ${pinned ? "fixo" : "comparar"}</button></div>
            </div>`;
          }).join("") : `<div class="empty-state"><div><strong>nenhum run</strong>ajuste a busca ou filtro.</div></div>`;
          document.querySelectorAll("[data-run-id]").forEach((card) => {
            const open = () => {
              state.runId = card.dataset.runId;
              state.episodeIndex = 0;
              state.ply = 0;
              if (state.view === "compare" && !state.compare.includes(state.runId)) state.view = "replay";
              stopPlayback();
              renderAll();
              syncUrl();
            };
            card.addEventListener("click", (event) => {
              if (event.target.closest("[data-pin-id]")) return;
              open();
            });
            card.addEventListener("keydown", (event) => {
              if (event.target.closest("[data-pin-id]")) return;
              if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); }
            });
          });
          document.querySelectorAll("[data-pin-id]").forEach((button) => button.addEventListener("click", (event) => {
            event.stopPropagation();
            const id = button.dataset.pinId;
            if (state.compare.includes(id)) {
              state.compare = state.compare.filter((other) => other !== id);
            } else if (state.compare.length < 4) {
              state.compare = [...state.compare, id];
            }
            if (state.compare.length) state.view = "compare";
            else if (state.view === "compare") state.view = "replay";
            renderAll();
            syncUrl();
          }));
        }

        /* ---------- board ---------- */

        function parseFen(fen) {
          if (!fen) return Array.from({ length: 8 }, () => Array(8).fill(null));
          const rows = String(fen).split(" ")[0].split("/");
          return rows.map((row) => {
            const squares = [];
            for (const token of row) {
              if (/\d/.test(token)) for (let i = 0; i < Number(token); i += 1) squares.push(null);
              else squares.push(token);
            }
            return squares.slice(0, 8);
          });
        }

        function sideToMove(fen) {
          const fields = String(fen || "").split(" ");
          return fields[1] === "b" ? "Black" : "White";
        }

        function materialBalance(fen) {
          const matrix = parseFen(fen);
          let white = 0, black = 0;
          for (const row of matrix) for (const piece of row) {
            if (!piece) continue;
            if (piece === piece.toUpperCase()) white += PIECE_VALUES[piece] || 0;
            else black += PIECE_VALUES[piece] || 0;
          }
          return white - black;
        }

        function pieceSvg(piece) {
          const color = piece === piece.toUpperCase() ? "white" : "black";
          return `<svg class="piece-svg ${color}" role="img" aria-label="${PIECE_NAMES[piece] || "peça"}" viewBox="0 0 45 45" preserveAspectRatio="xMidYMid meet">${PIECES[piece] || ""}</svg>`;
        }

        /* Engine score → white-perspective win estimate for the gauge (display only). */
        function winEstimate(cp) {
          if (cp === null || cp === undefined) return 50;
          const clamped = clamp(Number(cp), -1500, 1500);
          return 50 * (1 + (2 / (1 + Math.exp(-0.004 * clamped)) - 1));
        }

        function renderBoard(episode) {
          const positions = episode.positions || [];
          const position = positions[Math.min(state.ply, positions.length - 1)] || positions[0] || {};
          const matrix = parseFen(position.fen);
          const selectedMove = episode.moves?.[state.ply - 1];
          const from = selectedMove?.uci?.slice(0, 2);
          const to = selectedMove?.uci?.slice(2, 4);
          const squares = [];
          for (let row = 0; row < 8; row += 1) {
            for (let file = 0; file < 8; file += 1) {
              const square = `${String.fromCharCode(97 + file)}${8 - row}`;
              const piece = matrix[row]?.[file];
              const classes = [((row + file) % 2 === 0 ? "light" : "dark")];
              if (square === from) classes.push("from");
              if (square === to) classes.push("to");
              const rankLabel = file === 0 ? `<span class="coord-rank">${8 - row}</span>` : "";
              const fileLabel = row === 7 ? `<span class="coord-file">${String.fromCharCode(97 + file)}</span>` : "";
              squares.push(`<div class="square ${classes.join(" ")}" aria-label="${square}${piece ? `, ${PIECE_NAMES[piece] || "peça"}` : ", vazio"}">${rankLabel}${fileLabel}<span class="piece">${piece ? pieceSvg(piece) : ""}</span></div>`);
            }
          }
          $("#board").innerHTML = squares.join("");
          const turn = sideToMove(position.fen);
          const balance = materialBalance(position.fen);
          const balanceText = balance === 0 ? "material igual" : `${balance > 0 ? "+" : ""}${balance} p/ ${balance > 0 ? "brancas" : "pretas"}`;
          const evalCp = currentEvalCp(episode);
          $("#board-status").innerHTML =
            `<span><span class="turn-dot ${turn === "White" ? "w" : "b"}"></span>vez das <strong>${turn === "White" ? "brancas" : "pretas"}</strong></span>` +
            `<span>${escapeHtml(balanceText)}</span>` +
            `<span>${evalCp === null ? "sem eval" : `<strong>${evalCp > 0 ? "+" : ""}${formatNumber(Math.round(evalCp))} cp</strong> brancas`}</span>`;
          const pct = evalCp === null ? 50 : winEstimate(evalCp);
          $("#gauge-fill").style.height = `${pct.toFixed(1)}%`;
          $("#gauge-label").textContent = evalCp === null ? "–" : `${Math.round(winEstimate(evalCp))}%`;
        }

        /* ---------- metrics access ---------- */

        function metricsForStep(run, stepId) {
          return (run.metrics || []).filter((metric) => metric.stepId === stepId);
        }

        function firstMetric(metrics, name) {
          return metrics.find((metric) => metric.metric === name);
        }

        function numOf(metric) {
          if (!metric || metric.valueNum === null || metric.valueNum === undefined) return null;
          const value = Number(metric.valueNum);
          return Number.isFinite(value) ? value : null;
        }

        function metricValue(metric, fallback = "n/a") {
          if (!metric) return fallback;
          if (metric.valueNum !== null && metric.valueNum !== undefined) return Number(metric.valueNum).toFixed(metric.unit === "centipawn" ? 0 : 2);
          return metric.valueText || fallback;
        }

        function metricClass(value) {
          if (value === "blunder") return "bad";
          if (value === "mistake" || value === "inaccuracy") return "warn";
          if (value === "best_or_good") return "good";
          return "";
        }

        function classLabel(moveClass) {
          return ({ blunder: "blunder", mistake: "erro", inaccuracy: "imprecisão", best_or_good: "bom / melhor" })[moveClass] || "sem classe";
        }

        function cplLabel(value) {
          return value === null || value === undefined ? "n/a" : `${formatNumber(Math.round(value))} cp`;
        }

        function cpLabel(value) {
          if (value === null || value === undefined) return "n/a";
          const abs = Math.abs(Number(value));
          if (abs >= 9000) {
            const distance = Math.max(0, Math.round((10000 - abs) / 100));
            return `${Number(value) > 0 ? "+" : "−"}M${distance}`;
          }
          return `${Number(value) > 0 ? "+" : ""}${formatNumber(Math.round(Number(value)))}`;
        }

        /* Eval at current ply, white perspective (display only; rich metrics duplicate engine_score). */
        function currentEvalCp(episode) {
          const run = currentRun();
          const move = episode.moves?.[state.ply - 1] || episode.moves?.[state.ply];
          if (!run || !move) return null;
          const metrics = metricsForStep(run, move.stepId);
          const before = numOf(firstMetric(metrics, "chess.engine_score_before") || firstMetric(metrics, "chess.cp_before"));
          if (before !== null) return before;
          return null;
        }

        /* ---------- rich analysis rows (reporter-only derivation) ---------- */

        function isModelMove(move) {
          return ["Model", "Model opponent"].includes(move.actorKind);
        }

        function analysisRows(run, episode) {
          return (episode?.moves || []).filter(isModelMove).map((move) => {
            const metrics = metricsForStep(run, move.stepId);
            const cplValue = numOf(firstMetric(metrics, "chess.cpl"));
            const classValue = firstMetric(metrics, "chess.move_class")?.valueText || null;
            const agreementMetric = firstMetric(metrics, "chess.best_move_agreement");
            const agreement = agreementMetric && agreementMetric.valueNum !== null && agreementMetric.valueNum !== undefined
              ? Number(agreementMetric.valueNum) === 1 : null;
            const phase = firstMetric(metrics, "chess.cpl")?.dimensions?.phase
              || move.phase || (move.moveNumber <= 10 ? "opening" : move.moveNumber <= 30 ? "middlegame" : "endgame");
            const mateBefore = numOf(firstMetric(metrics, "chess.mate_before"));
            const mateAfter = numOf(firstMetric(metrics, "chess.mate_after"));
            return {
              ...move,
              cpl: cplValue,
              moveClass: classValue,
              agreement,
              phase,
              engineBestMove: firstMetric(metrics, "chess.engine_best_move")?.valueText || null,
              engineScoreBefore: numOf(firstMetric(metrics, "chess.engine_score_before")),
              engineScoreAfter: numOf(firstMetric(metrics, "chess.engine_score_after")),
              cpBefore: numOf(firstMetric(metrics, "chess.cp_before")),
              cpAfter: numOf(firstMetric(metrics, "chess.cp_after_chosen")),
              wdl: numOf(firstMetric(metrics, "chess.wdl_loss")),
              rank: numOf(firstMetric(metrics, "chess.chosen_rank")),
              pv: firstMetric(metrics, "chess.principal_variation")?.valueText || null,
              mateTransition: firstMetric(metrics, "chess.mate_transition")?.valueText || null,
              mateBefore,
              mateAfter,
              evaluator: metrics[0]?.evaluator || null,
              metricVersion: metrics[0]?.version || null,
            };
          });
        }

        function summarize(rows) {
          const withCpl = rows.filter((row) => row.cpl !== null);
          const cpls = withCpl.map((row) => row.cpl);
          const wdls = rows.map((row) => row.wdl).filter((value) => value !== null);
          const ranks = rows.map((row) => row.rank).filter((value) => value !== null);
          const agreements = rows.map((row) => row.agreement).filter((value) => value !== null);
          const classes = rows.reduce((counts, row) => {
            if (row.moveClass) counts[row.moveClass] = (counts[row.moveClass] || 0) + 1;
            return counts;
          }, {});
          const phases = {};
          for (const row of withCpl) {
            const bucket = phases[row.phase] || (phases[row.phase] = []);
            bucket.push(row.cpl);
          }
          const phaseStats = Object.fromEntries(Object.entries(phases).map(([phase, values]) => [
            phase, { n: values.length, acpl: mean(values), median: medianOf(values), worst: Math.max(...values) },
          ]));
          const rankDist = ranks.reduce((counts, rank) => {
            const bucket = rank <= 1 ? "1" : rank <= 2 ? "2" : rank <= 3 ? "3" : "4+";
            counts[bucket] = (counts[bucket] || 0) + 1;
            return counts;
          }, {});
          const mateCounts = rows.reduce((counts, row) => {
            if (row.mateTransition && row.mateTransition !== "none") {
              counts[row.mateTransition] = (counts[row.mateTransition] || 0) + 1;
            }
            return counts;
          }, {});
          return {
            n: rows.length,
            nCpl: cpls.length,
            acpl: mean(cpls),
            median: medianOf(cpls),
            worst: cpls.length ? Math.max(...cpls) : null,
            wdlMean: mean(wdls),
            wdlN: wdls.length,
            classes,
            top1: agreements.length ? agreements.filter(Boolean).length / agreements.length : null,
            top1N: agreements.length,
            top3: ranks.length ? ranks.filter((rank) => rank <= 3).length / ranks.length : null,
            top3N: ranks.length,
            phaseStats,
            rankDist,
            mateCounts,
          };
        }

        function stockfishProof(run, episode) {
          const stockfishMove = episode?.moves?.find((move) => move.actorKind === "Stockfish" && move.policy);
          const opponent = (run.opponents || []).find((player) => player.policy?.plugin === "chess.stockfish");
          const config = opponent?.policy?.config || {};
          const policy = stockfishMove?.policy || {};
          const options = policy.options || {};
          const limit = policy.limit || {};
          const binary = policy.binary_sha256 || policy.binary || "n/a";
          const evaluators = [...new Set((run.metrics || []).map((metric) => `${metric.evaluator}@${metric.version || "?"}`).filter(Boolean))];
          return {
            name: policy.engine_name || "Stockfish",
            target: policy.requested_elo ?? config.elo ?? "n/a",
            effective: policy.effective_uci_elo ?? "n/a",
            mode: policy.strength_mode || (policy.approximate ? "aproximado" : "não informado"),
            nodes: limit.nodes ?? config.nodes ?? "n/a",
            threads: options.Threads ?? config.Threads ?? "n/a",
            hash: options.Hash ?? config.Hash ?? "n/a",
            binary: String(binary),
            evaluators: evaluators.join(", ") || "não executado",
          };
        }

        /* ---------- charts ---------- */

        function evalCurveChart(rows) {
          const points = rows.filter((row) => row.cpBefore !== null && row.cpBefore !== undefined);
          if (!points.length) {
            return `<div class="analysis-empty compact"><div><strong>Sem curva de avaliação</strong><p>Este recorte não tem <code>chess.cp_before</code> por lance. A curva aparece quando o evaluator pós-hoc publica scores do engine.</p></div></div>`;
          }
          const width = 960, height = 250, left = 52, right = 14, top = 16, bottom = 32;
          const plotWidth = width - left - right, plotHeight = height - top - bottom;
          const limit = 1200;
          const yFor = (value) => top + plotHeight / 2 - (clamp(Number(value), -limit, limit) / limit) * (plotHeight / 2 - 6);
          const xFor = (index) => left + (points.length === 1 ? plotWidth / 2 : (index / (points.length - 1)) * plotWidth);
          const grid = [-limit, -limit / 2, 0, limit / 2, limit].map((value) =>
            `<line class="grid-line" x1="${left}" x2="${width - right}" y1="${yFor(value)}" y2="${yFor(value)}"></line>` +
            `<text class="axis-label" x="${left - 7}" y="${yFor(value) + 4}" text-anchor="end">${value === 0 ? "0" : (value > 0 ? "+" : "") + value}</text>`
          ).join("");
          const path = points.map((row, index) => `${index === 0 ? "M" : "L"}${xFor(index).toFixed(1)},${yFor(row.cpBefore).toFixed(1)}`).join(" ");
          const area = `${path} L${xFor(points.length - 1).toFixed(1)},${yFor(0).toFixed(1)} L${xFor(0).toFixed(1)},${yFor(0).toFixed(1)} Z`;
          const dots = points.map((row, index) => {
            const tone = row.moveClass === "blunder" ? "blunder" : row.moveClass === "mistake" ? "mistake" : "";
            return `<circle class="eval-dot ${tone}" data-analysis-ply="${row.ply}" cx="${xFor(index).toFixed(1)}" cy="${yFor(row.cpBefore).toFixed(1)}" r="4.5"><title>ply ${row.ply} · ${escapeHtml(row.san || row.display)} · ${escapeHtml(cpLabel(row.cpBefore))} cp · ${escapeHtml(classLabel(row.moveClass))}</title></circle>`;
          }).join("");
          return `<div class="chart-wrap"><p class="chart-title">Avaliação do engine ao longo da partida <small>chess.cp_before · perspectiva das brancas · clamp ±${limit}</small></p>` +
            `<svg class="eval-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Curva de avaliação do engine"><title>Eval por lance do modelo</title>${grid}<line class="zero-line" x1="${left}" x2="${width - right}" y1="${yFor(0)}" y2="${yFor(0)}"></line><path class="eval-area" d="${area}"></path><path class="eval-line" d="${path}"></path>${dots}</svg>` +
            `<div class="chart-caption"><span>clique num ponto para abrir o replay naquele ply</span><span>${points.length}/${rows.length} lances com score</span></div></div>`;
        }

        function cplChart(rows) {
          const points = rows.filter((row) => row.cpl !== null);
          if (!points.length) {
            return `<div class="analysis-empty compact"><div><strong>Sem avaliação Stockfish</strong><p>Este recorte tem a partida registrada, mas ainda não tem observações CPL por lance. O gráfico aparece quando um evaluator pós-hoc for anexado ao run.</p></div></div>`;
          }
          const width = 960, height = 250, left = 52, right = 14, top = 16, bottom = 32;
          const plotWidth = width - left - right, plotHeight = height - top - bottom;
          const maxCpl = Math.max(300, Math.ceil(Math.max(...points.map((point) => point.cpl)) / 100) * 100);
          const slot = plotWidth / Math.max(rows.length, 1);
          const barWidth = Math.max(4, Math.min(20, slot * 0.64));
          const yFor = (value) => top + plotHeight - (value / maxCpl) * plotHeight;
          const grid = [0, maxCpl / 2, maxCpl].map((value) =>
            `<line class="grid-line" x1="${left}" x2="${width - right}" y1="${yFor(value)}" y2="${yFor(value)}"></line>` +
            `<text class="axis-label" x="${left - 7}" y="${yFor(value) + 4}" text-anchor="end">${Math.round(value)}</text>`
          ).join("");
          const bars = rows.map((row, index) => {
            if (row.cpl === null) return "";
            const x = left + index * slot + (slot - barWidth) / 2;
            const y = yFor(row.cpl);
            const barHeight = Math.max(2, top + plotHeight - y);
            const tone = row.moveClass === "blunder" ? "blunder" : row.moveClass === "mistake" ? "mistake" : row.moveClass === "inaccuracy" ? "inaccuracy" : "good";
            return `<rect class="bar ${tone}" data-analysis-ply="${row.ply}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barWidth.toFixed(2)}" height="${barHeight.toFixed(2)}" rx="1"><title>ply ${row.ply} · ${escapeHtml(row.san || row.display)} · ${escapeHtml(cplLabel(row.cpl))} · ${escapeHtml(classLabel(row.moveClass))}</title></rect>`;
          }).join("");
          const labels = rows.map((row, index) => {
            const shouldShow = rows.length <= 18 || index === 0 || index === rows.length - 1 || index % Math.ceil(rows.length / 9) === 0;
            if (!shouldShow) return "";
            const x = left + index * slot + slot / 2;
            return `<text class="axis-label" x="${x.toFixed(2)}" y="${height - 8}" text-anchor="middle">${row.ply}</text>`;
          }).join("");
          return `<div class="chart-wrap"><p class="chart-title">Perda em centipawns por lance <small>CPL · cor = classe v1.0.0 (≥300/≥100/≥50)</small></p>` +
            `<svg class="cpl-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Gráfico de perda em centipawns por lance do modelo"><title>CPL por lance do modelo</title>${grid}<line class="baseline" x1="${left}" x2="${width - right}" y1="${top + plotHeight}" y2="${top + plotHeight}"></line>${bars}${labels}</svg>` +
            `<div class="chart-caption"><span>ply do modelo · perda em centipawns</span><span>${points.length}/${rows.length} lances com CPL</span></div>` +
            `<div class="chart-legend"><span class="legend-item"><i class="legend-swatch good"></i>bom</span><span class="legend-item"><i class="legend-swatch inaccuracy"></i>imprecisão ≥50</span><span class="legend-item"><i class="legend-swatch mistake"></i>erro ≥100</span><span class="legend-item"><i class="legend-swatch blunder"></i>blunder ≥300</span></div></div>`;
        }

        function incidentList(rows) {
          const incidents = rows
            .filter((row) => row.cpl !== null && ["blunder", "mistake", "inaccuracy"].includes(row.moveClass))
            .sort((a, b) => b.cpl - a.cpl).slice(0, 8);
          if (!incidents.length) {
            return `<div class="analysis-empty compact"><div><strong>Nenhum erro classificado</strong><p>Blunders, erros e imprecisões aparecem aqui quando o evaluator publica CPL + classe.</p></div></div>`;
          }
          return `<div class="incident-list">${incidents.map((row) => `
            <button class="incident-item" type="button" data-analysis-ply="${row.ply}">
              <span class="incident-ply">${row.ply}</span>
              <span class="incident-main"><span class="incident-move">${escapeHtml(row.san || row.display)}</span>
              <span class="incident-meta" style="display:block">${escapeHtml(classLabel(row.moveClass))} · ${row.side === "White" ? "brancas" : "pretas"}${row.engineBestMove ? ` · melhor ${escapeHtml(row.engineBestMove)}` : ""}${row.wdl !== null ? ` · ΔWDL ${row.wdl.toFixed(3)}` : ""}</span></span>
              <span class="incident-cpl">${escapeHtml(cplLabel(row.cpl))}<small>${row.rank !== null ? `rank ${row.rank}` : "sem rank"}</small></span>
            </button>`).join("")}</div>`;
        }

        function phaseTable(summary) {
          const order = ["opening", "middlegame", "endgame"];
          const names = { opening: "abertura ≤10", middlegame: "meio-jogo 11–30", endgame: "final 31+" };
          const entries = order.filter((phase) => summary.phaseStats[phase]);
          if (!entries.length) {
            return `<div class="analysis-empty compact"><div><strong>Sem slices por fase</strong><p>O CPL deste run não carrega <code>dimensions.phase</code>.</p></div></div>`;
          }
          return `<div class="analysis-summary">${entries.map((phase) => {
            const stats = summary.phaseStats[phase];
            return `<div class="analysis-summary-row"><span>${names[phase]} · ${stats.n} lances</span><strong>ACPL ${escapeHtml(cplLabel(stats.acpl))} · mediana ${escapeHtml(cplLabel(stats.median))}</strong></div>`;
          }).join("")}</div><p class="analysis-note">Fase = dimensions.phase do chess.cpl (opening ≤10, middlegame 11–30, endgame 31+).</p>`;
        }

        function rankAndMate(summary) {
          const dist = summary.rankDist;
          const total = Object.values(dist).reduce((a, b) => a + b, 0);
          const rankLine = total
            ? ["1", "2", "3", "4+"].map((bucket) => `${bucket}º: ${dist[bucket] || 0}`).join(" · ")
            : "sem chess.chosen_rank neste recorte";
          const mateEntries = Object.entries(summary.mateCounts);
          const mateLine = mateEntries.length
            ? mateEntries.map(([kind, count]) => `${kind}: ${count}`).join(" · ")
            : "nenhuma transição de mate registrada";
          return `<div class="analysis-summary">
            <div class="analysis-summary-row"><span>distribuição de rank</span><strong>${escapeHtml(rankLine)}</strong></div>
            <div class="analysis-summary-row"><span>top-3 (rank ≤ 3)</span><strong class="blue">${summary.top3 === null ? "n/a" : `${Math.round(summary.top3 * 100)}% · ${summary.top3N} lances`}</strong></div>
            <div class="analysis-summary-row"><span>transições de mate</span><strong>${escapeHtml(mateLine)}</strong></div>
          </div><p class="analysis-note">${escapeHtml(FORMULA_TOPK)}. Rank e PV vêm do MultiPV do evaluator pós-hoc; linhas ranqueadas completas ficam no Parquet/CAS.</p>`;
        }

        function analysisTable(rows) {
          if (!rows.length) {
            return `<div class="analysis-empty compact"><div><strong>Sem lances do modelo</strong><p>Este episódio não tem lance do modelo comparável ao Stockfish.</p></div></div>`;
          }
          return `<div class="analysis-table-wrap"><table class="analysis-table"><thead><tr><th scope="col">ply</th><th scope="col">lance</th><th scope="col">CPL</th><th scope="col">classe</th><th scope="col">ΔWDL</th><th scope="col">rank</th><th scope="col">melhor lance</th><th scope="col">SF antes → depois</th><th scope="col">PV</th></tr></thead><tbody>${rows.map((row) => {
            const pvShort = row.pv ? row.pv.split(" ").slice(0, 5).join(" ") : "n/a";
            const mateFlag = row.mateTransition && row.mateTransition !== "none" ? ` · ${escapeHtml(row.mateTransition)}` : "";
            return `<tr data-analysis-ply="${row.ply}"><td class="muted">${row.ply}</td>` +
              `<td class="move-link">${escapeHtml(row.san || row.display)}</td>` +
              `<td class="cpl ${metricClass(row.moveClass)}">${escapeHtml(cplLabel(row.cpl))}</td>` +
              `<td><span class="tag ${row.moveClass === "blunder" ? "red" : row.moveClass === "mistake" || row.moveClass === "inaccuracy" ? "orange" : row.moveClass === "best_or_good" ? "mint" : ""}">${escapeHtml(classLabel(row.moveClass))}</span></td>` +
              `<td class="muted">${row.wdl === null ? "n/a" : row.wdl.toFixed(3)}</td>` +
              `<td class="muted">${row.rank === null ? "n/a" : `nº ${row.rank}`}</td>` +
              `<td class="muted">${row.engineBestMove ? `${escapeHtml(row.engineBestMove)} · ` : ""}${row.agreement === null ? "n/a" : row.agreement ? "acordo" : "alternativa"}</td>` +
              `<td class="muted">${escapeHtml(cpLabel(row.cpBefore))} → ${escapeHtml(cpLabel(row.cpAfter))}${mateFlag}</td>` +
              `<td class="muted pv" title="${escapeHtml(row.pv || "")}">${escapeHtml(pvShort)}</td></tr>`;
          }).join("")}</tbody></table></div>`;
        }

        /* ---------- replay view ---------- */

        function renderReplay(run, episode) {
          const maxPly = episode.moves?.length || 0;
          state.ply = Math.min(Math.max(Number(state.ply), 0), maxPly);
          const move = episode.moves?.[state.ply - 1];
          const metrics = move ? metricsForStep(run, move.stepId) : [];
          const cpl = firstMetric(metrics, "chess.cpl");
          const moveClass = firstMetric(metrics, "chess.move_class");
          const agreement = firstMetric(metrics, "chess.best_move_agreement");
          const wdl = firstMetric(metrics, "chess.wdl_loss");
          const rank = firstMetric(metrics, "chess.chosen_rank");
          $("#board").innerHTML = "";
          renderBoard(episode);
          $("#ply-range").max = String(maxPly);
          $("#ply-range").value = String(state.ply);
          $("#ply-counter").textContent = `${String(state.ply).padStart(2, "0")} / ${String(maxPly).padStart(2, "0")}`;
          $("#move-title").textContent = move ? `${move.side} · ${move.san || move.display}` : "Posição inicial";
          $("#move-subtitle").textContent = move ? `${move.actorKind} · ${shortActor(move.actor)}` : `${episode.id || "episódio"} · estado inicial`;
          const cplNum = numOf(cpl);
          $("#metric-cpl").textContent = metricValue(cpl);
          $("#metric-cpl").className = `metric-value ${cplNum !== null && cplNum > 100 ? "warn" : cplNum !== null ? "good" : ""}`;
          $("#metric-class").textContent = metricValue(moveClass);
          $("#metric-class").className = `metric-value ${metricClass(moveClass?.valueText)}`;
          const agreementText = agreement ? (Number(agreement.valueNum) === 1 ? "sim" : "não") : "n/a";
          const extra = [
            wdl && wdl.valueNum !== null ? `ΔWDL ${Number(wdl.valueNum).toFixed(3)}` : null,
            rank && rank.valueNum !== null ? `rank ${Number(rank.valueNum)}` : null,
          ].filter(Boolean).join(" · ");
          $("#metric-agreement").innerHTML = `${escapeHtml(agreementText)}${extra ? `<br /><small>${escapeHtml(extra)}</small>` : ""}`;
          $("#metric-agreement").className = `metric-value ${agreement && Number(agreement.valueNum) === 1 ? "good" : agreement ? "warn" : ""}`;
          $("#btn-first").disabled = state.ply === 0;
          $("#btn-prev").disabled = state.ply === 0;
          $("#btn-next").disabled = state.ply >= maxPly;
          $("#btn-last").disabled = state.ply >= maxPly;
          $("#play-btn").textContent = state.playing ? "pausar" : "reproduzir";
          $("#step-eval-detail").textContent = move ? `${metrics.length} observações ligadas a este registro` : "escolha um lance para ver a avaliação";
        }

        function runAggregate(run) {
          const episodes = run.episodes || [];
          const moves = episodes.flatMap((episode) => episode.moves || []);
          const modelMoves = moves.filter(isModelMove);
          const engineMoves = moves.filter((move) => move.actorKind === "Stockfish");
          const cpls = (run.metrics || []).filter((metric) => metric.metric === "chess.cpl" && metric.valueNum !== null).map((metric) => Number(metric.valueNum));
          const classes = (run.metrics || []).filter((metric) => metric.metric === "chess.move_class").reduce((acc, metric) => { acc[metric.valueText] = (acc[metric.valueText] || 0) + 1; return acc; }, {});
          const agreements = (run.metrics || []).filter((metric) => metric.metric === "chess.best_move_agreement" && metric.valueNum !== null);
          const wdls = (run.metrics || []).filter((metric) => metric.metric === "chess.wdl_loss" && metric.valueNum !== null).map((metric) => Number(metric.valueNum));
          return { episodes, moves, modelMoves, engineMoves, cpls, classes, agreements, wdls };
        }

        function renderStats(run) {
          const aggregate = runAggregate(run);
          const totalPlies = aggregate.moves.length;
          const cplAvg = aggregate.cpls.length ? mean(aggregate.cpls).toFixed(1) : "n/a";
          const wdlAvg = aggregate.wdls.length ? mean(aggregate.wdls).toFixed(3) : "n/a";
          const agreement = aggregate.agreements.length ? `${Math.round(100 * aggregate.agreements.reduce((a, m) => a + Number(m.valueNum), 0) / aggregate.agreements.length)}%` : "n/a";
          const status = run.status === "COMPLETED" ? "COMPLETED" : run.status || "n/a";
          $("#stats").innerHTML = `
            <div class="stat"><div class="stat-label">status</div><div class="stat-value ${run.status === "COMPLETED" ? "mint" : "accent"}">${escapeHtml(status)}</div></div>
            <div class="stat"><div class="stat-label">plies / episódios</div><div class="stat-value">${formatNumber(totalPlies)} <small>/ ${aggregate.episodes.length}</small></div></div>
            <div class="stat"><div class="stat-label">chamadas ao provider</div><div class="stat-value accent">${formatNumber(run.provider?.calls || 0)}</div></div>
            <div class="stat"><div class="stat-label">tokens entrada / saída</div><div class="stat-value">${formatNumber(run.provider?.tokens?.input || 0)} <small>/ ${formatNumber(run.provider?.tokens?.output || 0)}</small></div></div>
            <div class="stat"><div class="stat-label">ACPL / acordo SF / ΔWDL</div><div class="stat-value">${cplAvg} <small>/ ${agreement} / ${wdlAvg}</small></div></div>`;
        }

        function renderFacts(run) {
          const model = run.model || {};
          const opponent = (run.opponents || []).map((player) => player.policy?.plugin || "oponente").join(", ") || "n/a";
          const strategy = model.strategy || "n/a";
          const task = run.task || {};
          const policyConfig = (run.opponents || []).find((player) => player.policy?.plugin === "chess.stockfish")?.policy?.config || {};
          const stockfishMove = run.episodes?.flatMap((episode) => episode.moves || []).find((move) => move.actorKind === "Stockfish");
          const policy = stockfishMove?.policy || {};
          const requestedElo = policy.requested_elo ?? policyConfig.elo;
          const effectiveElo = policy.effective_uci_elo;
          const modelSide = (run.players || []).find((player) => player.model)?.side?.slice(0, 1) || "?";
          const opponentLabel = opponent.includes("stockfish") ? "Stockfish" : opponent.replace(/^chess\./, "");
          $("#facts").innerHTML = `
            <div class="player-card"><div class="player-side">${escapeHtml(modelSide)}</div><div><div class="player-name">${escapeHtml(model.model || "modelo não identificado")}</div><div class="player-detail">${escapeHtml(model.provider || "provider?")} · ${escapeHtml(strategy)}</div></div></div>
            <div class="player-card"><div class="player-side">${opponent.includes("stockfish") ? "♞" : "B"}</div><div><div class="player-name">${escapeHtml(opponentLabel)}</div><div class="player-detail">${requestedElo ? `target ${escapeHtml(requestedElo)} · efetivo ${escapeHtml(effectiveElo || "n/a")}` : "política registrada no run"}</div></div></div>
            <div class="fact-row"><span>backend</span><strong>${escapeHtml(model.backend || "n/a")}</strong></div>
            <div class="fact-row"><span>run</span><strong>${escapeHtml(prettyExperiment(run.experiment || "n/a"))}</strong></div>
            <div class="fact-row"><span>tarefa / limite</span><strong>${escapeHtml(task.kind || "n/a")} · ${escapeHtml(task.max_plies ?? "n/a")} plies</strong></div>
            <div class="fact-row"><span>assistência</span><strong>${escapeHtml(run.declaredAssistance || "n/a")} → ${escapeHtml(run.effectiveAssistance || "n/a")}</strong></div>
            <div class="fact-row"><span>custo</span><strong>${run.provider?.costStatus === "reported" ? "reportado" : "não calculado"}</strong></div>`;
        }

        function renderMoveList(run, episode) {
          const moves = episode.moves || [];
          $("#move-list").innerHTML = moves.length ? moves.map((move, index) => {
            const stepMetrics = metricsForStep(run, move.stepId);
            const cpl = firstMetric(stepMetrics, "chess.cpl");
            const moveClass = firstMetric(stepMetrics, "chess.move_class");
            const rank = firstMetric(stepMetrics, "chess.chosen_rank");
            const cplText = cpl && cpl.valueNum !== null ? `${Number(cpl.valueNum).toFixed(0)} cp` : "n/a";
            const cplClass = moveClass ? metricClass(moveClass.valueText) : "";
            const rankText = rank && rank.valueNum !== null ? ` · nº${Number(rank.valueNum)}` : "";
            return `
            <button class="move-item ${index + 1 === state.ply ? "active" : ""}" data-ply="${index + 1}">
              <span class="move-number">${String(move.moveNumber || Math.floor(index / 2) + 1).padStart(2, "0")}${move.side === "White" ? "." : "…"}</span>
              <span><span class="move-san"><span class="class-dot ${moveClass?.valueText || "none"}" title="${escapeHtml(classLabel(moveClass?.valueText))}"></span> ${escapeHtml(move.san || move.display)}</span>
              <span class="move-sub" style="display:block">${escapeHtml(move.uci || move.actorKind)} · ${escapeHtml(move.actorKind)}</span></span>
              <span class="move-badges"><span class="move-eval ${cplClass}">${escapeHtml(cplText)}${escapeHtml(rankText)}</span></span>
            </button>`;
          }).join("") : `<div class="empty-state" style="grid-column:1/-1"><div><strong>sem lances</strong>este episódio não tem lances confirmados.</div></div>`;
          document.querySelectorAll("[data-ply]").forEach((button) => button.addEventListener("click", () => { state.ply = Number(button.dataset.ply); updatePly(); }));
        }

        function renderEvents(run) {
          const query = state.eventQuery.trim().toLowerCase();
          const all = (run.events || []).slice().reverse();
          const events = (query ? all.filter((event) => `${event.type} ${JSON.stringify(event.payload || {})}`.toLowerCase().includes(query)) : all).slice(0, 40);
          $("#events-meta").textContent = `${events.length}/${all.length} eventos`;
          $("#events").innerHTML = events.length ? events.map((event) => {
            const payload = event.payload || {};
            const payloadHtml = Object.keys(payload).length ? `<details class="event-details"><summary><span class="event-name">${escapeHtml(event.type)}</span><span class="event-meta" style="display:block">${escapeHtml(formatDate(event.at))} · ${event.artifactCount || 0} artefatos</span></summary><pre class="event-payload">${escapeHtml(JSON.stringify(payload, null, 2))}</pre></details>` : `<div class="event-details"><div class="event-name">${escapeHtml(event.type)}</div><div class="event-meta">${escapeHtml(formatDate(event.at))} · ${event.artifactCount || 0} artefatos</div></div>`;
            return `<div class="event-item"><div></div><div>${payloadHtml}</div></div>`;
          }).join("") : `<div class="empty-state"><div><strong>sem eventos</strong>ajuste o filtro de eventos.</div></div>`;
        }

        /* ---------- analysis view ---------- */

        function renderAnalysis(run) {
          const episode = currentEpisode(run);
          const rows = analysisRows(run, episode);
          const summary = summarize(rows);
          const proof = stockfishProof(run, episode);
          const engineResult = episode.result === "checkmate" ? `mate · ${episode.winner || "lado?"}` : episode.result || "em andamento";
          const agreementLabel = summary.top1 === null ? "n/a" : `${Math.round(summary.top1 * 100)}%`;
          const wdlLabel = summary.wdlMean === null ? "n/a" : summary.wdlMean.toFixed(3);
          $("#app").innerHTML = `
            <section class="analysis-toolbar fade-in"><div><p>Uma leitura por lance da atuação do modelo contra o engine — derivada só do que o evaluator pós-hoc já publicou.</p><p class="formula">${escapeHtml(FORMULA_ACPL)} · ${escapeHtml(FORMULA_CLASS)}</p></div></section>
            <section class="analysis-kpis fade-in">
              <div class="analysis-kpi"><span class="analysis-kpi-label">ACPL</span><strong class="analysis-kpi-value blue">${escapeHtml(cplLabel(summary.acpl))}</strong><span class="analysis-kpi-sub">mediana ${escapeHtml(cplLabel(summary.median))} · ${summary.nCpl}/${summary.n} lances</span></div>
              <div class="analysis-kpi"><span class="analysis-kpi-label">pior lance</span><strong class="analysis-kpi-value red">${escapeHtml(cplLabel(summary.worst))}</strong><span class="analysis-kpi-sub">máximo CPL do modelo</span></div>
              <div class="analysis-kpi"><span class="analysis-kpi-label">ΔWDL médio</span><strong class="analysis-kpi-value violet">${escapeHtml(wdlLabel)}</strong><span class="analysis-kpi-sub">${escapeHtml(FORMULA_WDL)} · ${summary.wdlN} lances</span></div>
              <div class="analysis-kpi"><span class="analysis-kpi-label">top-1 / top-3</span><strong class="analysis-kpi-value mint">${escapeHtml(agreementLabel)}${summary.top3 !== null ? ` <small style="font-size:14px">/ ${Math.round(summary.top3 * 100)}%</small>` : ""}</strong><span class="analysis-kpi-sub">${summary.top1N} c/ bestmove · ${summary.top3N} c/ rank</span></div>
              <div class="analysis-kpi"><span class="analysis-kpi-label">blunders</span><strong class="analysis-kpi-value red">${formatNumber(summary.classes.blunder || 0)}</strong><span class="analysis-kpi-sub">erros ${formatNumber(summary.classes.mistake || 0)} · imprec. ${formatNumber(summary.classes.inaccuracy || 0)}</span></div>
              ${summary.nCpl ? `<div class="analysis-kpi"><span class="analysis-kpi-label">bom / melhor</span><strong class="analysis-kpi-value mint">${formatNumber(summary.classes.best_or_good || 0)}</strong><span class="analysis-kpi-sub">de ${formatNumber(summary.n)} lances do modelo</span></div>
              <div class="analysis-kpi"><span class="analysis-kpi-label">resultado</span><strong class="analysis-kpi-value orange">${escapeHtml(engineResult)}</strong><span class="analysis-kpi-sub">${escapeHtml(episode.id || "episódio")}</span></div>
              <div class="analysis-kpi"><span class="analysis-kpi-label">transições mate</span><strong class="analysis-kpi-value orange">${formatNumber(Object.values(summary.mateCounts).reduce((a, b) => a + b, 0))}</strong><span class="analysis-kpi-sub">${escapeHtml(Object.entries(summary.mateCounts).map(([k, v]) => `${k}:${v}`).join(" · ") || "nenhuma")}</span></div>` : ""}
            </section>
            <section class="analysis-grid">
              <article class="analysis-panel fade-in"><div class="analysis-panel-head"><div><p class="eyebrow">posição e perda</p><h3>Eval + CPL ao longo da partida</h3></div><small>${escapeHtml(episode.id || "episódio")}</small></div><div class="analysis-panel-body">${evalCurveChart(rows)}${cplChart(rows)}</div></article>
              <div class="analysis-side">
                <article class="analysis-panel fade-in"><div class="analysis-panel-head"><div><p class="eyebrow">pontos críticos</p><h3>Piores lances</h3></div><small>top 8</small></div><div class="analysis-panel-body">${incidentList(rows)}</div></article>
                <article class="analysis-panel fade-in"><div class="analysis-panel-head"><div><p class="eyebrow">cobertura</p><h3>Resumo do diagnóstico</h3></div><small>${escapeHtml(run.status || "n/a")}</small></div><div class="analysis-panel-body"><div class="analysis-summary"><div class="analysis-summary-row"><span>lances do modelo</span><strong>${formatNumber(summary.n)}</strong></div><div class="analysis-summary-row"><span>lances com CPL</span><strong>${formatNumber(summary.nCpl)} / ${formatNumber(summary.n)}</strong></div><div class="analysis-summary-row"><span>ACPL / mediana</span><strong>${escapeHtml(cplLabel(summary.acpl))} / ${escapeHtml(cplLabel(summary.median))}</strong></div><div class="analysis-summary-row"><span>bom / melhor</span><strong class="mint">${formatNumber(summary.classes.best_or_good || 0)}</strong></div><div class="analysis-summary-row"><span>imprecisões</span><strong>${formatNumber(summary.classes.inaccuracy || 0)}</strong></div><div class="analysis-summary-row"><span>erros</span><strong class="orange">${formatNumber(summary.classes.mistake || 0)}</strong></div><div class="analysis-summary-row"><span>blunders</span><strong class="red">${formatNumber(summary.classes.blunder || 0)}</strong></div><div class="analysis-summary-row"><span>lances sem classe</span><strong>${formatNumber(summary.classes.none || 0)}</strong></div></div></div></article>
                <article class="analysis-panel fade-in"><div class="analysis-panel-head"><div><p class="eyebrow">fases</p><h3>CPL por fase</h3></div><small>dimensions.phase</small></div><div class="analysis-panel-body">${phaseTable(summary)}</div></article>
                <article class="analysis-panel fade-in"><div class="analysis-panel-head"><div><p class="eyebrow">profundidade</p><h3>Rank + mate</h3></div><small>multipv</small></div><div class="analysis-panel-body">${rankAndMate(summary)}</div></article>
              </div>
            </section>
            <article class="analysis-panel fade-in" style="margin-top:18px"><div class="analysis-panel-head"><div><p class="eyebrow">proveniência</p><h3>Configuração do Stockfish</h3></div><small>evaluator real</small></div><div class="analysis-panel-body"><div class="engine-proof"><div class="engine-proof-title">parâmetros registrados no run</div><div class="analysis-summary"><div class="engine-proof-row"><span>engine</span><strong>${escapeHtml(proof.name)}</strong></div><div class="engine-proof-row"><span>força solicitada / efetiva</span><strong>${escapeHtml(proof.target)} / ${escapeHtml(proof.effective)}</strong></div><div class="engine-proof-row"><span>limite</span><strong>${escapeHtml(proof.nodes)} nodes · ${escapeHtml(proof.threads)} threads · ${escapeHtml(proof.hash)} MB</strong></div><div class="engine-proof-row"><span>modo</span><strong>${escapeHtml(proof.mode)}</strong></div><div class="engine-proof-row"><span>evaluators</span><strong>${escapeHtml(proof.evaluators)}</strong></div><div class="engine-proof-row"><span>binário sha256</span><strong>${escapeHtml(proof.binary.slice(0, 24))}…</strong></div></div><p class="engine-proof-note">CPL mede a perda em centipawns atribuída ao lance do modelo. "n/a" significa que o evaluator não publicou observação para aquele registro. Nada aqui recalcula o engine: é só leitura do snapshot.</p></div></div></article>
            <article class="analysis-panel fade-in" style="margin-top:18px"><div class="analysis-panel-head"><div><p class="eyebrow">auditoria lance a lance</p><h3>Decisões do modelo</h3></div><small>${formatNumber(rows.length)} registros</small></div><div class="analysis-panel-body">${analysisTable(rows)}</div></article>
            <p class="analysis-note">Clique num ponto crítico, barra, ponto da curva ou linha para voltar ao replay exatamente naquele ply. A tela é somente leitura e não recalcula o engine no navegador.</p>`;
          bindAnalysisNav();
        }

        function bindAnalysisNav() {
          document.querySelectorAll("[data-analysis-ply]").forEach((element) => element.addEventListener("click", () => {
            state.ply = Number(element.dataset.analysisPly);
            state.view = "replay";
            stopPlayback();
            renderAll();
            syncUrl();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }));
        }

        /* ---------- compare view ---------- */

        function compareMetrics(run) {
          const rows = (run.episodes || []).flatMap((episode) => analysisRows(run, episode));
          const summary = summarize(rows);
          const aggregate = runAggregate(run);
          return { rows, summary, aggregate };
        }

        function renderCompare() {
          const runs = state.compare.map(runById).filter(Boolean);
          if (!runs.length) {
            $("#app").innerHTML = `<div class="panel empty-state fade-in"><div><strong>Nada fixado para comparar</strong><p>Fixe até 4 runs com o botão 📌 na lista ao lado. O comparativo usa só métricas pós-hoc já publicadas — ACPL, ΔWDL, top-1/top-3, classes.</p></div></div>`;
            return;
          }
          const computed = runs.map((run) => ({ run, ...compareMetrics(run) }));
          const cell = (value, cls = "") => `<td class="${cls}">${value}</td>`;
          const numCells = (get, { lower = true, format = (v) => v } = {}) => {
            const values = computed.map(({ summary }) => get(summary));
            const finite = values.filter((v) => v !== null && v !== undefined);
            const best = finite.length ? (lower ? Math.min(...finite) : Math.max(...finite)) : null;
            return computed.map(({ summary }) => {
              const value = get(summary);
              const text = value === null || value === undefined ? "n/a" : format(value);
              const cls = value !== null && best !== null && value === best && finite.length > 1 ? "best" : "";
              return cell(escapeHtml(text), cls);
            }).join("");
          };
          $("#app").innerHTML = `
            <p class="compare-hint fade-in">Comparativo reporter-only: cada coluna é um run, cada célula deriva de métricas pós-hoc já publicadas. <code>ACPL = mean(chess.cpl)</code> · classes v1.0.0 (≥300/≥100/≥50) · sem claims de Elo a partir de run único.</p>
            <article class="panel fade-in"><div class="panel-head"><div><p class="eyebrow">lado a lado</p><h3>${runs.length} runs fixados</h3></div><small>clique no título p/ abrir o run</small></div>
            <div class="compare-table-wrap"><table class="compare-table"><thead><tr><th scope="col">métrica</th>${computed.map(({ run }) => `<th scope="col"><a href="#" data-open-run="${escapeHtml(run.id)}" style="color:inherit">${escapeHtml(prettyExperiment(run.experiment))}</a><small>${escapeHtml(shortId(run.id))} · ${escapeHtml(run.status || "")}</small></th>`).join("")}</tr></thead><tbody>
              <tr><td>resultado</td>${computed.map(({ run }) => { const ep = run.episodes?.[0]; return cell(escapeHtml(ep?.result ? `${ep.result}${ep.winner ? ` · ${ep.winner}` : ""}` : "n/a")); }).join("")}</tr>
              <tr><td>lances do modelo (c/ CPL)</td>${computed.map(({ summary }) => cell(`${formatNumber(summary.n)} (${formatNumber(summary.nCpl)})`)).join("")}</tr>
              <tr><td>ACPL</td>${numCells((s) => s.acpl, { format: (v) => cplLabel(v) })}</tr>
              <tr><td>mediana CPL</td>${numCells((s) => s.median, { format: (v) => cplLabel(v) })}</tr>
              <tr><td>pior CPL</td>${numCells((s) => s.worst, { format: (v) => cplLabel(v) })}</tr>
              <tr><td>ΔWDL médio</td>${numCells((s) => s.wdlMean, { format: (v) => v.toFixed(3) })}</tr>
              <tr><td>top-1</td>${numCells((s) => s.top1, { lower: false, format: (v) => `${Math.round(v * 100)}%` })}</tr>
              <tr><td>top-3</td>${numCells((s) => s.top3, { lower: false, format: (v) => `${Math.round(v * 100)}%` })}</tr>
              <tr><td>blunders</td>${numCells((s) => s.classes.blunder || 0)}</tr>
              <tr><td>erros</td>${numCells((s) => s.classes.mistake || 0)}</tr>
              <tr><td>imprecisões</td>${numCells((s) => s.classes.inaccuracy || 0)}</tr>
              <tr><td>bom / melhor</td>${numCells((s) => s.classes.best_or_good || 0, { lower: false })}</tr>
              <tr><td>plies totais</td>${computed.map(({ aggregate }) => cell(formatNumber(aggregate.moves.length))).join("")}</tr>
              <tr><td>provider calls</td>${computed.map(({ run }) => cell(formatNumber(run.provider?.calls || 0))).join("")}</tr>
              <tr><td>tokens in/out</td>${computed.map(({ run }) => cell(`${formatNumber(run.provider?.tokens?.input || 0)} / ${formatNumber(run.provider?.tokens?.output || 0)}`)).join("")}</tr>
            </tbody></table></div></article>
            <p class="analysis-note">Verde = melhor da coluna (menor ACPL/CPL/WDL/erros; maior top-1/top-3/bons). Comparar runs não estabelece claim de sistema: condições, budgets e assistance podem diferir — confira proveniência em cada run.</p>`;
          document.querySelectorAll("[data-open-run]").forEach((link) => link.addEventListener("click", (event) => {
            event.preventDefault();
            state.runId = link.dataset.openRun;
            state.episodeIndex = 0;
            state.ply = 0;
            state.view = "replay";
            renderAll();
            syncUrl();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }));
        }

        /* ---------- main render ---------- */

        function renderMain(run) {
          if (!run) {
            $("#run-title").textContent = "Nenhum run disponível";
            $("#view-kicker").textContent = "snapshot local";
            $("#snapshot-meta").innerHTML = `<strong>snapshot vazio</strong>`;
            $("#app").innerHTML = `<div class="panel empty-state"><div><strong>Sem dados de partida</strong>gere o recorte com <code>uv run python scripts/build_readonly_viewer.py</code>.</div></div>`;
            return;
          }
          const episode = currentEpisode(run);
          $("#view-kicker").textContent = state.view === "analysis" ? "análise da partida" : state.view === "compare" ? "comparativo" : "replay local";
          $("#run-title").textContent = state.view === "compare" ? `${state.compare.length} runs em comparação` : prettyExperiment(run.experiment || run.id);
          $("#snapshot-meta").innerHTML = `<strong>${escapeHtml(shortId(run.id))}</strong><br />${escapeHtml(formatDate(run.startedAt))} → ${escapeHtml(formatDate(run.finishedAt))}<br /><span class="tag mint">somente leitura</span>`;
          $("#analysis-btn").textContent = state.view === "analysis" ? "voltar ao replay" : "análise da partida";
          $("#analysis-btn").setAttribute("aria-pressed", state.view === "analysis" ? "true" : "false");
          $("#compare-btn").setAttribute("aria-pressed", state.view === "compare" ? "true" : "false");
          if (state.view === "analysis") {
            renderAnalysis(run);
            return;
          }
          if (state.view === "compare") {
            renderCompare();
            return;
          }
          $("#app").innerHTML = `
            <section id="stats" class="stats-grid fade-in"></section>
            <section class="stage-grid">
              <article class="panel fade-in">
                <div class="panel-head"><div><p class="eyebrow">posição</p><h3>Tabuleiro</h3></div><select id="episode-select" class="episode-select" aria-label="Selecionar episódio">${(run.episodes || []).map((item, index) => `<option value="${index}" ${index === state.episodeIndex ? "selected" : ""}>episódio ${index + 1} · ${escapeHtml(item.result || item.status || "n/a")}</option>`).join("")}</select></div>
                <div class="board-zone"><div class="eval-gauge" title="Estimativa de vitória das brancas a partir do score do engine (só exibição)"><div id="gauge-fill" class="white-fill" style="height:50%"></div><div id="gauge-label" class="gauge-label">–</div></div><div class="board-col"><div class="board-wrap"><div id="board" class="board" aria-label="Tabuleiro de xadrez"></div></div><div id="board-status" class="board-status"></div></div></div>
                <div class="replay-bar">
                  <div class="replay-current"><div><h4 id="move-title" aria-live="polite">Posição inicial</h4><p id="move-subtitle" aria-live="polite">estado inicial</p></div><div id="ply-counter" class="ply-counter" aria-live="polite">00 / 00</div></div>
                  <input id="ply-range" class="range" type="range" min="0" max="0" value="0" aria-label="Selecionar ply" />
                  <div class="transport"><button id="btn-first" aria-label="Ir para o primeiro lance" title="Primeiro ply">|◀</button><button id="btn-prev" aria-label="Voltar um lance" title="Ply anterior">◀</button><button id="play-btn" class="play-btn" aria-label="Reproduzir ou pausar a partida">reproduzir</button><button id="btn-next" aria-label="Avançar um lance" title="Próximo ply">▶</button><button id="btn-last" aria-label="Ir para o último lance" title="Último ply">▶|</button><select id="speed-select" class="speed-select" aria-label="Velocidade de reprodução"><option value="1400">0.5×</option><option value="900" selected>1×</option><option value="450">2×</option><option value="220">4×</option></select><span class="kbd-hint">← → navegam · espaço reproduz · Home/End</span></div>
                </div>
              </article>
              <div class="side-stack">
                <article class="panel fade-in"><div class="panel-head"><div><p class="eyebrow">avaliação do engine</p><h3>Avaliação</h3></div><small id="step-eval-detail">n/a</small></div><div class="metric-body"><div class="metric-hero"><div class="metric-box"><label>CPL</label><strong id="metric-cpl" class="metric-value">n/a</strong></div><div class="metric-box"><label>classe</label><strong id="metric-class" class="metric-value">n/a</strong></div><div class="metric-box"><label>acordo SF</label><strong id="metric-agreement" class="metric-value">n/a</strong></div></div><div class="metric-list"><div class="metric-row"><span>observações nesta partida</span><strong>${formatNumber(run.metrics?.length || 0)}</strong></div><div class="metric-row"><span>avaliadores</span><strong>${escapeHtml([...new Set((run.metrics || []).map((metric) => metric.evaluator).filter(Boolean))].join(", ") || "n/a")}</strong></div><div class="metric-row"><span>resultado do episódio</span><strong>${escapeHtml(episode.result || "n/a")}${episode.winner ? ` · ${escapeHtml(episode.winner)}` : ""}</strong></div></div></div></article>
                <article class="panel fade-in"><div class="panel-head"><div><p class="eyebrow">jogadores e origem</p><h3>Quem jogou</h3></div><small>${escapeHtml(run.status || "n/a")}</small></div><div id="facts" class="facts-body"></div></article>
              </div>
            </section>
            <section class="lower-grid">
              <article class="panel fade-in"><div class="panel-head"><div><p class="eyebrow">lances confirmados</p><h3>Lances</h3></div><small>${escapeHtml(episode.id || "episódio")}</small></div><div class="move-list-head"><span>ponto = classe do lance · CPL + rank</span><span>${(episode.moves || []).length} plies</span></div><div id="move-list" class="move-list"></div></article>
              <article class="panel fade-in"><div class="panel-head"><div><p class="eyebrow">linha de eventos</p><h3>Eventos</h3></div><small id="events-meta">últimos 40 eventos</small></div><div class="events-tools"><input id="event-search" type="search" placeholder="filtrar eventos…" aria-label="Filtrar eventos" value="${escapeHtml(state.eventQuery)}" /></div><div class="events-body"><div id="events" class="events-list"></div></div></article>
            </section>
            <p class="footnote">Recorte gerado em <code>${escapeHtml(DATA.generatedAt || "n/a")}</code> · atualizar: <code>uv run python scripts/build_readonly_viewer.py</code> · auto-refresh via <code>meta.json</code></p>`;
          renderStats(run);
          renderFacts(run);
          renderMoveList(run, episode);
          renderEvents(run);
          renderReplay(run, episode);
          bindTransport(episode);
          $("#event-search")?.addEventListener("input", (event) => { state.eventQuery = event.target.value; renderEvents(run); });
        }

        function bindTransport(episode) {
          $("#episode-select")?.addEventListener("change", (event) => {
            state.episodeIndex = Number(event.target.value);
            state.ply = 0;
            const scrollTop = window.scrollY;
            renderMain(currentRun());
            window.scrollTo(0, scrollTop);
            syncUrl();
          });
          $("#speed-select")?.addEventListener("change", (event) => {
            state.speed = Number(event.target.value);
            if (state.playing) startPlayback();
          });
          $("#speed-select").value = String(state.speed);
          $("#ply-range").addEventListener("input", (event) => { state.ply = Number(event.target.value); updatePly(); });
          $("#btn-first").addEventListener("click", () => { state.ply = 0; updatePly(); });
          $("#btn-prev").addEventListener("click", () => { state.ply = Math.max(0, state.ply - 1); updatePly(); });
          $("#btn-next").addEventListener("click", () => { state.ply = Math.min(episode.moves.length, state.ply + 1); updatePly(); });
          $("#btn-last").addEventListener("click", () => { state.ply = episode.moves.length; updatePly(); });
          $("#play-btn").addEventListener("click", () => state.playing ? stopPlayback() : startPlayback());
        }

        function startPlayback() {
          const episode = currentEpisode(currentRun());
          if (!episode.moves?.length) return;
          stopPlayback();
          state.playing = true;
          state.timer = setInterval(() => {
            if (state.ply >= episode.moves.length) { stopPlayback(); return; }
            state.ply += 1;
            updatePly();
          }, state.speed);
          updatePly();
        }

        function stopPlayback() {
          state.playing = false;
          if (state.timer) clearInterval(state.timer);
          state.timer = null;
          if ($("#play-btn")) $("#play-btn").textContent = "reproduzir";
        }

        function updateMoveSelection() {
          document.querySelectorAll("[data-ply]").forEach((button) => button.classList.toggle("active", Number(button.dataset.ply) === state.ply));
        }

        function updatePly() {
          const run = currentRun();
          if (!run) return;
          const episode = currentEpisode(run);
          renderReplay(run, episode);
          updateMoveSelection();
          syncUrl();
        }

        function renderAll() {
          renderSnapshotCard();
          renderRunList();
          renderMain(currentRun());
        }

        $("#search").addEventListener("input", (event) => { state.query = event.target.value; renderRunList(); syncUrl(); });
        document.querySelectorAll("[data-filter]").forEach((button) => button.addEventListener("click", () => {
          state.filter = button.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach((item) => item.classList.toggle("active", item === button));
          renderRunList();
          syncUrl();
        }));
        $("#analysis-btn").addEventListener("click", () => {
          state.view = state.view === "analysis" ? "replay" : "analysis";
          stopPlayback();
          renderAll();
          syncUrl();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        $("#compare-btn").addEventListener("click", () => {
          if (state.view === "compare") {
            state.view = "replay";
          } else {
            state.view = "compare";
            if (!state.compare.length && state.runId) state.compare = [state.runId];
          }
          stopPlayback();
          renderAll();
          syncUrl();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        $("#update-pill").addEventListener("click", reloadSnapshot);
        document.addEventListener("keydown", (event) => {
          if (event.target.matches("input, select, textarea")) return;
          if (state.view !== "replay") return;
          if (event.key === "ArrowLeft") { state.ply = Math.max(0, state.ply - 1); updatePly(); }
          if (event.key === "ArrowRight") { const episode = currentEpisode(currentRun()); state.ply = Math.min(episode.moves.length, state.ply + 1); updatePly(); }
          if (event.key === " ") { event.preventDefault(); state.playing ? stopPlayback() : startPlayback(); }
          if (event.key === "Home") { event.preventDefault(); state.ply = 0; updatePly(); }
          if (event.key === "End") { event.preventDefault(); state.ply = currentEpisode(currentRun()).moves.length; updatePly(); }
        });

        const defaultRunId = DATA.runs.find((run) => run.status === "COMPLETED" && !String(run.experiment || "").startsWith("fake-"))?.id || DATA.runs.find((run) => run.status === "COMPLETED")?.id || DATA.runs[0]?.id || null;
        restoreUrlState(defaultRunId);
        renderAll();
        pollSnapshot();
        setInterval(pollSnapshot, 15000);
        setInterval(renderSnapshotCard, 30000);
      })();
    </script>
  </body>
</html>
