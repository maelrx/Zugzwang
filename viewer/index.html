<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zugzwang Match Desk</title>
    <style>
      @font-face {
        font-family: "Geist Sans";
        src: url("fonts/GeistSans.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("fonts/GeistMono.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }

      :root {
        --ink: #0c1017;
        --ink-2: #121822;
        --panel: rgba(20, 27, 38, 0.88);
        --panel-2: rgba(26, 34, 46, 0.6);
        --line: rgba(226, 235, 230, 0.11);
        --line-bright: rgba(226, 235, 230, 0.22);
        --paper: #f2eee4;
        --muted: #93a1ab;
        --faint: #67727b;
        --orange: #f5a65b;
        --orange-soft: rgba(245, 166, 91, 0.13);
        --mint: #7de2c5;
        --mint-soft: rgba(125, 226, 197, 0.12);
        --red: #ee8278;
        --red-soft: rgba(238, 130, 120, 0.1);
        --blue: #8eaae9;
        --blue-soft: rgba(142, 170, 233, 0.1);
        --violet: #c4a8ee;
        --board-light: #eedab9;
        --board-dark: #a87f57;
        --board-highlight: #cdd26a;
        --shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
        --sans: "Geist Sans", "Noto Sans", "Segoe UI", sans-serif;
        --mono: "Geist Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;
        --display: "Geist Sans", "Noto Sans", "Segoe UI", sans-serif;
        --radius: 6px;
      }

      * { box-sizing: border-box; }

      html { color-scheme: dark; background: var(--ink); }

      body {
        min-width: 320px;
        margin: 0;
        color: var(--paper);
        background:
          radial-gradient(circle at 78% 4%, rgba(66, 113, 101, 0.18), transparent 28rem),
          radial-gradient(circle at 10% 96%, rgba(245, 166, 91, 0.07), transparent 24rem),
          var(--ink);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.55;
        font-variant-numeric: tabular-nums;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        content: "";
        opacity: 0.2;
        background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      button, input, select { font: inherit; touch-action: manipulation; }
      button { color: inherit; }

      button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 3px;
      }

      .skip-link {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 40;
        padding: 9px 12px;
        border: 1px solid var(--orange);
        color: var(--ink);
        background: var(--orange);
        font-family: var(--mono);
        font-size: 11px;
        transform: translateY(-180%);
        transition: transform 160ms ease-out;
      }

      .skip-link:focus { transform: translateY(0); }

      .app-shell {
        display: grid;
        grid-template-columns: 308px minmax(0, 1fr);
        min-height: 100vh;
      }

      /* ---------- rail ---------- */

      .rail {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        padding: 26px 18px 16px;
        border-right: 1px solid var(--line);
        background: rgba(10, 14, 21, 0.78);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid rgba(245, 166, 91, 0.5);
        color: var(--orange);
        font-size: 18px;
        transform: rotate(45deg);
      }

      .brand-mark span { transform: rotate(-45deg); }

      .eyebrow {
        margin: 0 0 7px;
        color: var(--orange);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1, h2, h3, p { margin-top: 0; }

      h1 {
        margin-bottom: 0;
        color: var(--paper);
        font-family: var(--display);
        font-size: clamp(30px, 3vw, 40px);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 0.92;
      }

      .brand-copy { padding-top: 2px; }

      .brand-subtitle {
        margin: 10px 0 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .snapshot-card {
        margin-bottom: 14px;
        padding: 10px 11px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.025);
        font-family: var(--mono);
        font-size: 10px;
        line-height: 1.7;
      }

      .snapshot-card .live-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--mint);
        box-shadow: 0 0 0 4px var(--mint-soft);
        vertical-align: 1px;
      }

      .snapshot-card .live-dot.stale { background: var(--orange); box-shadow: 0 0 0 4px var(--orange-soft); }
      .snapshot-card .live-dot.off { background: var(--faint); box-shadow: none; }

      .snapshot-card strong { color: var(--paper); font-weight: 600; }
      .snapshot-card .dim { color: var(--faint); }

      .update-pill {
        display: none;
        width: 100%;
        margin-top: 8px;
        padding: 8px 10px;
        border: 1px solid rgba(125, 226, 197, 0.5);
        cursor: pointer;
        color: var(--mint);
        background: var(--mint-soft);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: background 150ms ease;
      }

      .update-pill.show { display: block; }
      .update-pill:hover { background: rgba(125, 226, 197, 0.2); }

      .search-box { position: relative; margin-bottom: 10px; }

      .search-box::before {
        position: absolute;
        top: 9px;
        left: 11px;
        color: var(--muted);
        content: "⌕";
        font-size: 17px;
      }

      .search-box input {
        width: 100%;
        padding: 10px 10px 10px 32px;
        border: 1px solid var(--line);
        outline: none;
        color: var(--paper);
        background: rgba(255, 255, 255, 0.035);
        font-family: var(--mono);
        font-size: 12px;
        transition: border-color 160ms ease, background 160ms ease;
      }

      .search-box input:focus {
        border-color: rgba(245, 166, 91, 0.6);
        background: rgba(255, 255, 255, 0.06);
      }

      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }

      .filter-btn {
        padding: 5px 8px;
        border: 1px solid var(--line);
        cursor: pointer;
        color: var(--muted);
        background: transparent;
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
      }

      .filter-btn:hover, .filter-btn.active {
        border-color: rgba(245, 166, 91, 0.52);
        color: var(--orange);
        background: var(--orange-soft);
      }

      .run-count {
        display: flex;
        justify-content: space-between;
        margin: 0 3px 8px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
      }

      .run-list {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 5px;
        min-height: 0;
        overflow: auto;
        padding-right: 3px;
      }

      .run-card {
        position: relative;
        width: 100%;
        padding: 11px 12px 10px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        cursor: pointer;
        text-align: left;
        background: transparent;
        transition: border-color 160ms ease, background 160ms ease;
      }

      .run-card:hover { background: rgba(255, 255, 255, 0.045); }

      .run-card.active {
        border-color: rgba(245, 166, 91, 0.38);
        background: linear-gradient(105deg, rgba(245, 166, 91, 0.14), rgba(245, 166, 91, 0.02));
      }

      .run-card.active::before {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -1px;
        width: 2px;
        background: var(--orange);
        content: "";
      }

      .run-card.pinned { border-color: rgba(142, 170, 233, 0.5); background: var(--blue-soft); }

      .run-card-top, .run-card-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .run-card-title {
        overflow: hidden;
        color: var(--paper);
        font-size: 13px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .run-card-id {
        margin-top: 3px;
        overflow: hidden;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .run-card-bottom { margin-top: 8px; }
      .run-card-meta { color: var(--muted); font-family: var(--mono); font-size: 10px; }
      .run-card-meta.good { color: var(--mint); }
      .run-card-meta.bad { color: var(--red); }

      .pin-btn {
        flex: 0 0 auto;
        padding: 2px 7px;
        border: 1px solid var(--line);
        cursor: pointer;
        color: var(--faint);
        background: transparent;
        font-family: var(--mono);
        font-size: 10px;
      }

      .pin-btn:hover { border-color: var(--blue); color: var(--blue); }
      .pin-btn.on { border-color: var(--blue); color: var(--blue); background: var(--blue-soft); }

      .status-dot {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .status-dot::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        content: "";
      }

      .status-dot.completed { color: var(--mint); }
      .status-dot.completed::before { background: var(--mint); }
      .status-dot.failed { color: var(--red); }
      .status-dot.failed::before { background: var(--red); }
      .status-dot.canceled { color: var(--orange); }
      .status-dot.canceled::before { background: var(--orange); }

      .rail-footer {
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
      }

      .rail-footer strong { color: var(--paper); font-weight: 500; }

      /* ---------- content ---------- */

      .content {
        min-width: 0;
        padding: 28px clamp(18px, 4vw, 56px) 60px;
      }

      .topbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 25px;
        margin-bottom: 24px;
      }

      .topbar h2 {
        max-width: 760px;
        margin-bottom: 0;
        color: var(--paper);
        font-family: var(--display);
        font-size: clamp(26px, 4.2vw, 54px);
        font-weight: 520;
        letter-spacing: -0.055em;
        line-height: 0.97;
        text-wrap: balance;
      }

      .topbar-meta {
        flex: 0 0 auto;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.7;
        text-align: right;
      }

      .topbar-meta strong { color: var(--paper); font-weight: 500; }

      .topbar-actions {
        display: flex;
        align-items: flex-end;
        gap: 12px;
      }

      .view-btn {
        min-height: 34px;
        padding: 8px 11px;
        border: 1px solid rgba(142, 170, 233, 0.42);
        border-radius: var(--radius);
        cursor: pointer;
        color: var(--blue);
        background: var(--blue-soft);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        transition: border-color 160ms ease, color 160ms ease, background 160ms ease;
      }

      .view-btn:hover {
        border-color: var(--blue);
        color: var(--paper);
        background: rgba(142, 170, 233, 0.18);
      }

      .view-btn[aria-pressed="true"] {
        border-color: rgba(125, 226, 197, 0.45);
        color: var(--mint);
        background: var(--mint-soft);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 0;
        margin-bottom: 18px;
      }

      .stat {
        min-height: 92px;
        padding: 13px 16px 12px 0;
        border-top: 1px solid var(--line-bright);
        border-bottom: 1px solid var(--line);
      }

      .stat-label {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .stat-value {
        margin-top: 9px;
        color: var(--paper);
        font-size: 24px;
        font-weight: 600;
        line-height: 1;
      }

      .stat-value.accent { color: var(--orange); }
      .stat-value.mint { color: var(--mint); }
      .stat-value small { font-size: 12px; font-weight: 400; color: var(--muted); }

      .stage-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.8fr);
        gap: 18px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 15px;
        padding: 16px 18px 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel-head h3 {
        margin-bottom: 0;
        color: var(--paper);
        font-family: var(--display);
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      .panel-head small { color: var(--muted); font-family: var(--mono); font-size: 10px; }

      .episode-select {
        max-width: 200px;
        padding: 7px 9px;
        border: 1px solid var(--line-bright);
        border-radius: 4px;
        outline: none;
        cursor: pointer;
        color: var(--paper);
        background: var(--ink-2);
        font-family: var(--mono);
        font-size: 10px;
      }

      /* ---------- board ---------- */

      .board-zone {
        display: flex;
        gap: 14px;
        align-items: stretch;
        padding: clamp(16px, 3.5vw, 30px);
        background:
          linear-gradient(130deg, rgba(125, 226, 197, 0.04), transparent 48%),
          rgba(7, 10, 15, 0.26);
      }

      .eval-gauge {
        position: relative;
        flex: 0 0 22px;
        overflow: hidden;
        border: 1px solid var(--line-bright);
        border-radius: 3px;
        background: #20242b;
      }

      .eval-gauge .white-fill {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, #f2eee4, #cfc8b4);
        transition: height 250ms ease;
      }

      .eval-gauge .gauge-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4px;
        z-index: 1;
        color: #0d1118;
        font-family: var(--mono);
        font-size: 8px;
        text-align: center;
        mix-blend-mode: plus-lighter;
      }

      .board-col { flex: 1; min-width: 0; }

      .board-wrap {
        width: min(100%, 600px);
        margin: 0 auto;
        padding: 10px;
        border: 1px solid rgba(242, 238, 228, 0.17);
        border-radius: 4px;
        background: #2a302f;
        box-shadow: 0 22px 50px rgba(0,0,0,0.38), 0 0 0 5px rgba(255,255,255,0.025);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, minmax(0, 1fr));
        width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
      }

      .square {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        aspect-ratio: 1;
        line-height: 1;
        user-select: none;
      }

      .square.light { background: var(--board-light); }
      .square.dark { background: var(--board-dark); }

      .square .coord-rank {
        position: absolute;
        left: 4px;
        top: 3px;
        font-size: clamp(7px, 1.1vw, 10px);
        font-weight: 700;
      }

      .square .coord-file {
        position: absolute;
        right: 5px;
        bottom: 3px;
        font-size: clamp(7px, 1.1vw, 10px);
        font-weight: 700;
      }

      .square.light .coord-rank, .square.light .coord-file { color: rgba(120, 84, 50, 0.85); }
      .square.dark .coord-rank, .square.dark .coord-file { color: rgba(242, 238, 228, 0.65); }

      .square .piece {
        position: relative;
        z-index: 1;
        display: grid;
        width: 80%;
        height: 80%;
        place-items: center;
      }

      .piece-svg { display: block; width: 100%; height: 100%; overflow: visible; }

      .piece-svg.white { color: #f8f1df; filter: drop-shadow(0 2px 1px rgba(38, 29, 23, 0.68)); }
      .piece-svg.black { color: #252a2e; filter: drop-shadow(0 1px 1px rgba(255, 248, 228, 0.24)); }

      .square.from, .square.to { background: var(--board-highlight); }
      .square.to { box-shadow: inset 0 0 0 4px rgba(72, 87, 47, 0.34); }

      .board-status {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: min(100%, 600px);
        margin: 10px auto 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
      }

      .board-status strong { color: var(--paper); }

      .turn-dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border: 1px solid var(--line-bright);
        border-radius: 2px;
        vertical-align: baseline;
      }

      .turn-dot.w { background: #f2eee4; }
      .turn-dot.b { background: #20242b; }

      .replay-bar { padding: 15px 18px 18px; border-top: 1px solid var(--line); }

      .replay-current {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 13px;
      }

      .replay-current h4 {
        margin: 0;
        color: var(--paper);
        font-family: var(--display);
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.035em;
      }

      .replay-current p { margin: 3px 0 0; color: var(--muted); font-size: 10px; font-family: var(--mono); }

      .ply-counter { color: var(--orange); font-size: 11px; font-family: var(--mono); white-space: nowrap; }

      .range { width: 100%; height: 4px; margin: 0 0 13px; accent-color: var(--orange); cursor: pointer; }

      .transport { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

      .transport button {
        min-width: 34px;
        height: 31px;
        padding: 0 10px;
        border: 1px solid var(--line-bright);
        border-radius: 4px;
        cursor: pointer;
        color: var(--paper);
        background: rgba(255,255,255,0.035);
        transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
      }

      .transport button:hover:not(:disabled) {
        border-color: var(--orange);
        color: var(--orange);
        background: var(--orange-soft);
      }

      .transport button:disabled { cursor: default; opacity: 0.32; }
      .transport .play-btn { min-width: 88px; color: var(--orange); }

      .speed-select {
        height: 31px;
        padding: 0 8px;
        border: 1px solid var(--line-bright);
        border-radius: 4px;
        color: var(--muted);
        background: var(--ink-2);
        font-family: var(--mono);
        font-size: 10px;
      }

      .kbd-hint { margin-left: auto; color: var(--faint); font-family: var(--mono); font-size: 10px; }

      .side-stack { display: grid; gap: 18px; }

      .metric-body, .facts-body, .events-body { padding: 17px 18px; }

      .metric-hero {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 7px;
        margin-bottom: 14px;
      }

      .metric-box {
        min-height: 80px;
        padding: 12px 11px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: rgba(255,255,255,0.025);
      }

      .metric-box label {
        display: block;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .metric-box strong {
        display: block;
        margin-top: 8px;
        color: var(--paper);
        font-size: 21px;
        font-weight: 600;
      }

      .metric-box strong.good { color: var(--mint); }
      .metric-box strong.warn { color: var(--orange); }
      .metric-box strong.bad { color: var(--red); }
      .metric-box small { color: var(--faint); font-size: 10px; font-weight: 400; }

      .metric-list { display: grid; gap: 1px; }

      .metric-row, .fact-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 15px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(226,235,230,0.08);
      }

      .metric-row:last-child, .fact-row:last-child { border-bottom: 0; }
      .metric-row span, .fact-row span { color: var(--muted); font-family: var(--mono); font-size: 11px; }
      .metric-row strong, .fact-row strong { color: var(--paper); font-size: 12px; font-weight: 600; text-align: right; }
      .fact-row strong { max-width: 67%; overflow-wrap: anywhere; }

      .player-card {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        margin-bottom: 11px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: rgba(255,255,255,0.025);
      }

      .player-side {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid var(--line-bright);
        color: var(--orange);
        font-family: var(--display);
        font-size: 18px;
      }

      .player-name { color: var(--paper); font-size: 13px; font-weight: 700; }
      .player-detail { margin-top: 3px; color: var(--muted); font-family: var(--mono); font-size: 10px; overflow-wrap: anywhere; }

      .tag {
        display: inline-flex;
        align-items: center;
        min-height: 20px;
        padding: 2px 6px;
        border: 1px solid var(--line-bright);
        border-radius: 3px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        line-height: 1.3;
        white-space: nowrap;
      }

      .tag.orange { border-color: rgba(245,166,91,0.38); color: var(--orange); background: var(--orange-soft); }
      .tag.mint { border-color: rgba(125,226,197,0.34); color: var(--mint); background: var(--mint-soft); }
      .tag.red { border-color: rgba(238,130,120,0.34); color: var(--red); background: rgba(238,130,120,0.09); }
      .tag.blue { border-color: rgba(142,170,233,0.4); color: var(--blue); background: var(--blue-soft); }

      .lower-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
        gap: 18px;
        margin-top: 18px;
      }

      .move-list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 18px 0;
        color: var(--faint);
        font-family: var(--mono);
        font-size: 10px;
      }

      .move-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 5px;
        max-height: 420px;
        overflow: auto;
        padding: 12px 18px 18px;
      }

      .move-item {
        display: grid;
        grid-template-columns: 30px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        text-align: left;
        background: rgba(255,255,255,0.025);
        transition: border-color 150ms ease, background 150ms ease;
      }

      .move-item:hover { border-color: var(--line-bright); }
      .move-item.active { border-color: rgba(245,166,91,0.48); background: var(--orange-soft); }

      .move-number { color: var(--muted); font-size: 10px; font-family: var(--mono); }
      .move-san { overflow: hidden; color: var(--paper); font-size: 16px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
      .move-sub { color: var(--muted); font-family: var(--mono); font-size: 9px; margin-top: 1px; }
      .move-badges { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }

      .class-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
      .class-dot.best_or_good, .class-dot.good { background: var(--mint); }
      .class-dot.inaccuracy { background: var(--blue); }
      .class-dot.mistake { background: var(--orange); }
      .class-dot.blunder { background: var(--red); }
      .class-dot.none { background: var(--faint); }

      .move-eval { font-family: var(--mono); font-size: 9px; white-space: nowrap; color: var(--muted); }
      .move-eval.good { color: var(--mint); }
      .move-eval.warn { color: var(--orange); }
      .move-eval.bad { color: var(--red); }

      .events-tools {
        display: flex;
        gap: 8px;
        padding: 12px 18px 0;
      }

      .events-tools input {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--paper);
        background: rgba(255,255,255,0.03);
        font-family: var(--mono);
        font-size: 11px;
      }

      .events-list { display: grid; gap: 1px; max-height: 420px; overflow: auto; }

      .event-item {
        display: grid;
        grid-template-columns: 9px minmax(0, 1fr);
        gap: 9px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(226,235,230,0.08);
      }

      .event-item::before {
        width: 5px;
        height: 5px;
        margin-top: 6px;
        border-radius: 50%;
        background: var(--mint);
        content: "";
      }

      .event-name { color: var(--paper); font-size: 12px; font-family: var(--mono); }
      .event-meta { margin-top: 2px; color: var(--muted); font-size: 10px; font-family: var(--mono); }
      .event-payload { margin: 8px 0 0; max-height: 180px; overflow: auto; color: #b9c4ca; font-family: var(--mono); font-size: 10px; white-space: pre-wrap; }

      .event-details summary { cursor: pointer; list-style: none; }
      .event-details summary::-webkit-details-marker { display: none; }
      .event-details summary::after { float: right; color: var(--muted); content: "+"; }
      .event-details[open] summary::after { content: "–"; }

      .empty-state {
        display: grid;
        min-height: 170px;
        place-items: center;
        padding: 30px;
        color: var(--muted);
        text-align: center;
      }

      .empty-state strong { display: block; margin-bottom: 6px; color: var(--paper); font-size: 22px; font-weight: 600; }

      .footnote {
        margin-top: 22px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        text-align: right;
      }

      .footnote code { color: var(--orange); }

      /* ---------- analysis view ---------- */

      .analysis-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .analysis-toolbar p { margin: 0; color: var(--muted); font-size: 13px; }
      .analysis-toolbar .formula { margin-top: 4px; color: var(--faint); font-family: var(--mono); font-size: 10px; }

      .analysis-kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1px;
        margin-bottom: 18px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--line);
      }

      .analysis-kpi { min-height: 96px; padding: 14px 15px; background: var(--panel); }

      .analysis-kpi-label {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .analysis-kpi-value { display: block; margin-top: 10px; color: var(--paper); font-size: 25px; font-weight: 650; line-height: 1; }
      .analysis-kpi-value.blue { color: var(--blue); }
      .analysis-kpi-value.orange { color: var(--orange); }
      .analysis-kpi-value.red { color: var(--red); }
      .analysis-kpi-value.mint { color: var(--mint); }
      .analysis-kpi-value.violet { color: var(--violet); }
      .analysis-kpi-sub { display: block; margin-top: 6px; color: var(--faint); font-family: var(--mono); font-size: 10px; }

      .analysis-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.38fr) minmax(300px, 0.62fr);
        gap: 18px;
        align-items: start;
      }

      .analysis-panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .analysis-panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 15px;
        padding: 16px 18px 14px;
        border-bottom: 1px solid var(--line);
      }

      .analysis-panel-head h3 { margin: 0; color: var(--paper); font-size: 19px; font-weight: 620; letter-spacing: -0.025em; }
      .analysis-panel-head small { color: var(--muted); font-family: var(--mono); font-size: 10px; }
      .analysis-panel-body { padding: 17px 18px; }

      .chart-wrap { min-height: 240px; padding: 6px 0 0; }
      .chart-wrap + .chart-wrap { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
      .chart-title { margin: 0 0 8px; color: var(--paper); font-size: 13px; font-weight: 650; }
      .chart-title small { color: var(--faint); font-family: var(--mono); font-size: 10px; font-weight: 400; }

      .eval-chart, .cpl-chart { display: block; width: 100%; height: auto; overflow: visible; }
      .eval-chart .grid-line, .cpl-chart .grid-line { stroke: rgba(226, 235, 230, 0.1); stroke-width: 1; }
      .eval-chart .axis-label, .cpl-chart .axis-label { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
      .eval-chart .eval-area { fill: rgba(142, 170, 233, 0.16); }
      .eval-chart .eval-line { fill: none; stroke: var(--blue); stroke-width: 2; }
      .eval-chart .eval-dot { fill: var(--blue); cursor: pointer; }
      .eval-chart .eval-dot.blunder { fill: var(--red); }
      .eval-chart .eval-dot.mistake { fill: var(--orange); }
      .eval-chart .zero-line { stroke: rgba(226, 235, 230, 0.3); stroke-width: 1; stroke-dasharray: 4 4; }
      .cpl-chart .bar { shape-rendering: crispEdges; cursor: pointer; }
      .cpl-chart .bar.good { fill: rgba(125, 226, 197, 0.74); }
      .cpl-chart .bar.inaccuracy { fill: rgba(142, 170, 233, 0.82); }
      .cpl-chart .bar.mistake { fill: rgba(245, 166, 91, 0.88); }
      .cpl-chart .bar.blunder { fill: rgba(238, 130, 120, 0.92); }
      .cpl-chart .baseline { stroke: rgba(226, 235, 230, 0.35); stroke-width: 1; }

      .chart-caption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 11px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
      }

      .chart-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
      .legend-item { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
      .legend-swatch { width: 8px; height: 8px; border-radius: 2px; }
      .legend-swatch.good { background: var(--mint); }
      .legend-swatch.inaccuracy { background: var(--blue); }
      .legend-swatch.mistake { background: var(--orange); }
      .legend-swatch.blunder { background: var(--red); }

      .analysis-side { display: grid; gap: 18px; }

      .incident-list { display: grid; gap: 6px; }

      .incident-item {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
        text-align: left;
        background: rgba(255, 255, 255, 0.025);
        transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
      }

      .incident-item:hover {
        border-color: rgba(238, 130, 120, 0.48);
        background: rgba(238, 130, 120, 0.08);
        transform: translateY(-1px);
      }

      .incident-ply {
        display: grid;
        min-height: 31px;
        place-items: center;
        color: var(--red);
        background: rgba(238, 130, 120, 0.1);
        border-radius: 3px;
        font-family: var(--mono);
        font-size: 10px;
      }

      .incident-main { min-width: 0; }
      .incident-move { overflow: hidden; color: var(--paper); font-size: 15px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
      .incident-meta { margin-top: 2px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
      .incident-cpl { color: var(--red); font-family: var(--mono); font-size: 12px; font-weight: 650; white-space: nowrap; text-align: right; }
      .incident-cpl small { display: block; color: var(--faint); font-size: 9px; font-weight: 400; }

      .analysis-summary { display: grid; gap: 1px; }

      .analysis-summary-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0;
        border-bottom: 1px solid rgba(226, 235, 230, 0.08);
      }

      .analysis-summary-row:last-child { border-bottom: 0; }
      .analysis-summary-row span { color: var(--muted); font-family: var(--mono); font-size: 10px; }
      .analysis-summary-row strong { color: var(--paper); font-size: 12px; font-weight: 620; text-align: right; }
      .analysis-summary-row strong.red { color: var(--red); }
      .analysis-summary-row strong.orange { color: var(--orange); }
      .analysis-summary-row strong.mint { color: var(--mint); }
      .analysis-summary-row strong.blue { color: var(--blue); }

      .engine-proof {
        display: grid;
        gap: 9px;
        padding: 13px;
        border: 1px solid rgba(142, 170, 233, 0.22);
        border-radius: 4px;
        background: rgba(142, 170, 233, 0.06);
      }

      .engine-proof-title { color: var(--blue); font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
      .engine-proof-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
      .engine-proof-row span { color: var(--muted); font-family: var(--mono); font-size: 10px; }
      .engine-proof-row strong { color: var(--paper); font-weight: 600; text-align: right; overflow-wrap: anywhere; }
      .engine-proof-note { margin: 1px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }

      .analysis-table-wrap { overflow-x: auto; }

      .analysis-table { width: 100%; border-collapse: collapse; font-size: 12px; }

      .analysis-table th {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line-bright);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-align: left;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .analysis-table td {
        padding: 9px 10px;
        border-bottom: 1px solid rgba(226, 235, 230, 0.08);
        color: var(--paper);
        white-space: nowrap;
      }

      .analysis-table tr:last-child td { border-bottom: 0; }
      .analysis-table tr[data-analysis-ply] { cursor: pointer; transition: background 150ms ease; }
      .analysis-table tr[data-analysis-ply]:hover { background: rgba(255, 255, 255, 0.045); }
      .analysis-table .muted { color: var(--muted); font-family: var(--mono); font-size: 10px; }
      .analysis-table .move-link { font-weight: 620; }
      .analysis-table .cpl { font-family: var(--mono); }
      .analysis-table .cpl.warn { color: var(--orange); }
      .analysis-table .cpl.bad { color: var(--red); }
      .analysis-table .cpl.good { color: var(--mint); }
      .analysis-table .pv { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

      .analysis-empty { display: grid; min-height: 230px; place-items: center; padding: 30px; text-align: center; }
      .analysis-empty.compact { min-height: 125px; }
      .analysis-empty strong { display: block; margin-bottom: 7px; color: var(--paper); font-size: 18px; font-weight: 620; }
      .analysis-empty p { max-width: 48ch; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

      .analysis-note { margin: 14px 0 0; color: var(--muted); font-family: var(--mono); font-size: 10px; line-height: 1.55; }

      /* ---------- compare view ---------- */

      .compare-table-wrap { overflow-x: auto; }
      .compare-table { width: 100%; border-collapse: collapse; font-size: 12px; }
      .compare-table th, .compare-table td { padding: 9px 12px; border-bottom: 1px solid rgba(226,235,230,0.08); text-align: right; white-space: nowrap; }
      .compare-table th:first-child, .compare-table td:first-child { text-align: left; color: var(--muted); font-family: var(--mono); font-size: 10px; }
      .compare-table thead th { color: var(--paper); font-size: 12px; border-bottom: 1px solid var(--line-bright); }
      .compare-table thead th small { display: block; color: var(--faint); font-family: var(--mono); font-size: 9px; font-weight: 400; }
      .compare-table td.best { color: var(--mint); font-weight: 700; }
      .compare-table td.worst { color: var(--red); }

      .compare-hint { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
      .compare-hint code { color: var(--blue); font-family: var(--mono); }

      .fade-in { animation: rise 420ms ease both; }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

      @media (max-width: 1150px) {
        .app-shell { grid-template-columns: 260px minmax(0, 1fr); }
        .stage-grid, .lower-grid, .analysis-grid { grid-template-columns: 1fr; }
        .side-stack, .analysis-side { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
        .analysis-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 760px) {
        .app-shell { display: block; }
        .rail { position: relative; height: auto; min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); }
        .run-list { max-height: 260px; }
        .content { padding: 22px 14px 42px; }
        .topbar { align-items: flex-start; flex-direction: column; gap: 12px; }
        .topbar h2 { max-width: 100%; font-size: 36px; white-space: normal; }
        .topbar-meta { text-align: left; }
        .topbar-actions { width: 100%; flex-wrap: wrap; }
        .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .stats-grid .stat:last-child { grid-column: span 2; }
        .side-stack, .analysis-side { grid-template-columns: 1fr; }
        .move-list { grid-template-columns: 1fr; }
        .board-zone { padding: 14px 10px; }
        .replay-current { align-items: flex-start; flex-direction: column; gap: 5px; }
        .analysis-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .kbd-hint { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div class="app-shell">
      <aside class="rail">
        <div class="brand">
          <div class="brand-copy">
            <p class="eyebrow">Zugzwang · laboratório local</p>

        <div id="app"></div>

    <script src="pieces.js"></script>
    <script id="zgw-data" src="data.js"></script>
    <script>
      (() => {
        "use strict";
        let DATA = window.ZUGZWANG_DATA || { runs: [], readOnly: true };
        const state = {
          query: "", filter: "all", runId: null, episodeIndex: 0, ply: 0,
          view: "replay", compare: [], playing: false, timer: null, speed: 900,
          snapshotSha: null, eventQuery: "",
        };
        const PIECES = window.ZUGZWANG_PIECES || {};
        const PIECE_NAMES = { K: "rei branco", Q: "dama branca", R: "torre branca", B: "bispo branco", N: "cavalo branco", P: "peão branco", k: "rei preto", q: "dama preta", r: "torre preta", b: "bispo preto", n: "cavalo preto", p: "peão preto" };
        const PIECE_VALUES = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0, p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };

        /* Thresholds: evaluator.stockfish move_class v1.0.0 (plugins/evaluator-stockfish).
           Shown verbatim wherever classification appears; reporter never re-thresholds. */
        const CLASS_LIMITS = { blunder: 300, mistake: 100, inaccuracy: 50 };
        const FORMULA_ACPL = "ACPL = mean(chess.cpl) sobre lances do modelo com CPL publicado";
        const FORMULA_CLASS = "classe v1.0.0: blunder ≥300cp · erro ≥100cp · imprecisão ≥50cp · senão bom/melhor";
        const FORMULA_WDL = "WDL médio = mean(chess.wdl_loss) em probabilidade [0,1]";
        const FORMULA_TOPK = "top-1 = acordo com bestmove · top-3 = chess.chosen_rank ≤ 3";

        const $ = (selector) => document.querySelector(selector);
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
        const formatNumber = (value) => new Intl.NumberFormat("pt-BR").format(Number(value || 0));
        const formatDate = (value) => value ? new Date(value).toLocaleString("pt-BR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "n/a";
        const shortId = (value) => String(value || "").replace(/^run_/, "").slice(0, 15);
        const clamp = (value, lo, hi) => Math.min(hi, Math.max(lo, value));
        const mean = (values) => values.length ? values.reduce((a, b) => a + b, 0) / values.length : null;
        const medianOf = (values) => {
          if (!values.length) return null;
          const sorted = [...values].sort((a, b) => a - b);
          return sorted[Math.floor(sorted.length / 2)];
        };

        function prettyExperiment(value) {
          const name = String(value || "run");
          const known = {
            "local-musespark-1-3-free-grounded-vs-stockfish": "MuseSpark 1.3 Free · Stockfish 1500 · grounded",
            "local-musespark-1-3-free-vs-stockfish-1000": "MuseSpark 1.3 Free · Stockfish 1000",
            "local-musespark-1-3-free-vs-stockfish-black": "MuseSpark 1.3 Free · Stockfish de brancas",
